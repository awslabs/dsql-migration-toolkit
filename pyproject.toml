[project]
name = "mysql-dsql-migrator"
version = "0.1.33"
description = "RDS/Aurora MySQL to Amazon Aurora DSQL migration toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "boto3==1.43.28",
    "nicegui==3.13.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pymysql==1.2.0",
    "sqlalchemy==2.0.50",
    "sqlglot==30.11.0",
]

[project.scripts]
mysql-dsql-migrator = "dsql_migrator.cli.main:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsql_migrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that require external infrastructure (a live MySQL and/or a PostgreSQL 16 container). Skipped unless RUN_INTEGRATION_TESTS=1 and the dependency is reachable.",
]
