[project]
name = "mysql-dsql-migrator"
version = "0.1.368"
description = "RDS/Aurora MySQL to Amazon Aurora DSQL migration toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "boto3==1.43.28",
    "nicegui==3.13.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pymysql==1.2.0",
    "sqlalchemy==2.0.50",
    "sqlglot==30.11.0",
]

[project.optional-dependencies]
# In-process CDC Kafka client for the Lambda-free ("External") SeedMode. Kept out of
# the CORE dependencies so a plain `pip install .` (and any non-container use) does
# NOT pull it; a local/laptop run that never uses SeedMode=External needs nothing
# extra. The published container image DOES bake this extra in (deploy/Dockerfile:
# `uv sync ... --extra cdc-external`) because the EC2+MSK-only host runs
# SeedMode=External and its docker-run user-data cannot pip-install into the
# root-owned image venv. Baking it in is safe for the standard Fargate/Lambda
# deployment: both wheels are pure-Python (py3-none-any, no C-extension build) and
# are imported LAZILY, only inside core/cdc_kafka_seed.py, reached only when
# seed_mode == "external" — so on Fargate/laptop (default "lambda") they stay inert.
# Do NOT drop `--extra cdc-external` from the Dockerfile: External hosts rely on it.
# These are the exact versions vendored in the offset-seeder Lambda zip.
cdc-external = [
    "kafka-python==3.0.10",
    "aws-msk-iam-sasl-signer-python==1.0.2",
]

[project.scripts]
mysql-dsql-migrator = "dsql_migrator.cli.main:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    # Playwright core for browser E2E of the NiceGUI UI. We use the sync/async
    # API directly (not the pytest-playwright plugin, which pins pytest<9 and
    # would conflict with pytest 9.0.3 above). Browser binaries are shared with
    # the existing Node install under ~/Library/Caches/ms-playwright.
    "playwright==1.61.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsql_migrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is the fast unit suite. Browser E2E (tests/e2e) launches a real
# app server + Chromium and is heavier / environment-dependent, so it is opt-in:
#   .venv/bin/python -m pytest -m e2e        # run the browser E2E suite
#   .venv/bin/python -m pytest               # unit suite only (E2E deselected)
addopts = "-m 'not e2e'"
markers = [
    "integration: end-to-end tests that require external infrastructure (a live MySQL and/or a PostgreSQL 16 container). Skipped unless RUN_INTEGRATION_TESTS=1 and the dependency is reachable.",
    "e2e: browser end-to-end tests (Playwright + a real app server). Opt-in via '-m e2e'; needs the 'playwright' dev dep + its Chromium build.",
]
