AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Single-tenant deployment of the MySQL -> Aurora DSQL migration tool into a
  customer account/VPC (app-stack). Runs the control-plane app as a single-task
  Amazon ECS Fargate service in private subnets, fronted by an Application Load
  Balancer (HTTPS) with optional Amazon Cognito (OIDC) auth. The container image
  is pulled from Amazon ECR -- the ContainerImageUri default is the published ECR
  Public image, so a normal deploy needs NO build (build your own only on a
  restricted network; see deploy/Dockerfile + README). IAM is least privilege
  (scoped task + execution roles); job/session state is kept in the tool's managed
  S3 bucket so it survives a task replacement; no credentials are stored in this
  template. The optional streaming CDC pipeline (MSK + Debezium + Fargate sink) is
  a separate cdc-stack, not provisioned here.

# Console UX: group + label the parameters so uploading this template in the AWS
# CloudFormation console renders an ordered, sectioned "Specify stack details"
# form (required environment values first, then optional tiers) instead of a flat
# alphabetical list. The parameter TYPES already drive native pickers (VpcId -> VPC
# dropdown, the Subnet lists -> subnet multi-selectors), so the operator selects
# from their account rather than typing ids. Ignored by the CLI; console-only.
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "1. Network — where the tool runs (pick VPC & subnets from your account)"
        Parameters:
          - VpcId
          - AlbSubnetIds
          - ServiceSubnetIds
          - AlbScheme
          - AssignPublicIp
      - Label:
          default: "2. Migration endpoints — DSQL target (required) + MySQL source (optional)"
        Parameters:
          - DsqlClusterArn
          - SourceSecretArn
          - SourceDbSecurityGroupId
          - SourceDbCidr
          - SourceDbPort
      - Label:
          default: "3. TLS & access — HTTPS certificate (required) + who can reach the UI"
        Parameters:
          - CertificateArn
          - AllowedIngressCidr
          - HttpsEgressCidr
      - Label:
          default: "4. Authentication — only needed for a fully public (0.0.0.0/0) ALB"
        Parameters:
          - EnableCognitoAuth
          - CognitoDomainPrefix
          - CognitoAdminEmail
          - AppDomainName
      - Label:
          default: "5. Container image & sizing — defaults work, no image build needed"
        Parameters:
          - ContainerImageUri
          - ContainerCpu
          - ContainerMemory
          - AppPort
          - EnableActivityLogCloudWatch
      - Label:
          default: "6. AI assist — optional, off by default"
        Parameters:
          - EnableAiAssist
          - BedrockModelArns
          - BedrockRegion
          - BedrockModelId
    ParameterLabels:
      VpcId:
        default: "VPC  [Required] — use the VPC your source RDS/Aurora MySQL lives in"
      AlbSubnetIds:
        default: "ALB subnets  [Required] — pick 2+ in different AZs"
      ServiceSubnetIds:
        default: "Fargate task subnets  [Required] — 2+ private subnets in different AZs; no private/NAT subnets? reuse the ALB subnets above + set 'Assign task public IP' = ENABLED"
      AlbScheme:
        default: "ALB scheme  [Optional, default internal] — internal: reach via VPN/Direct Connect (recommended) · internet-facing: also set 'Allowed ingress CIDR' to your IP/32"
      AssignPublicIp:
        default: "Assign task public IP  [Optional, default DISABLED] — set ENABLED only for a no-NAT test (public subnets, egress via internet gateway)"
      DsqlClusterArn:
        default: "DSQL cluster ARN  [Required] — the target Aurora DSQL cluster"
      SourceSecretArn:
        default: "Source DB secret ARN  [Optional] — set only to reuse an existing Secrets Manager secret; otherwise enter host/user/password in the UI"
      SourceDbSecurityGroupId:
        default: "Source DB security group  [Required — this OR 'Source DB CIDR'] — preferred way to let the task reach the source"
      SourceDbCidr:
        default: "Source DB CIDR  [Required — this OR 'Source DB security group'] — use when you have no source security group id"
      SourceDbPort:
        default: "Source MySQL port  [Optional, default 3306]"
      CertificateArn:
        default: "HTTPS certificate ARN  [Required] — an ACM cert in this region; no domain? run  AWS_REGION=<region> deploy/create_test_cert.sh  to make a test one"
      AllowedIngressCidr:
        default: "Allowed ingress CIDR  [Optional] — who can reach the ALB · internal: your VPC/VPN CIDR · internet-facing: your public IP as x.x.x.x/32 (curl https://checkip.amazonaws.com)"
      HttpsEgressCidr:
        default: "Outbound HTTPS CIDR  [Optional] — tighten to your NAT/PrivateLink range"
      EnableCognitoAuth:
        default: "Enable Cognito login  [Optional, default off] — OIDC login at the ALB"
      CognitoDomainPrefix:
        default: "Cognito domain prefix  [Optional] — required only if Cognito login is enabled"
      CognitoAdminEmail:
        default: "First login user's email  [Optional] — required only if Cognito login is enabled; gets a temporary password by email"
      AppDomainName:
        default: "Custom domain  [Optional] — blank = use the ALB DNS name"
      ContainerImageUri:
        default: "Container image URI  [Optional] — blank = published ECR Public image (no build needed)"
      ContainerCpu:
        default: "Task CPU units  [Optional, default 512] — 512 for evaluation; 1024+ (ideally 4096) for a real Full Load (CPU-bound)"
      ContainerMemory:
        default: "Task memory (MiB)  [Optional, default 1024] — HARD limit (over it = OOM kill). 1024 eval; 2048+ real load; 8192+ for large TEXT/BLOB. Must be valid for the chosen CPU"
      AppPort:
        default: "Container listen port  [Optional, default 8080]"
      EnableActivityLogCloudWatch:
        default: "Activity log to CloudWatch  [Optional, default off] — mirror the audit trail to the container log group so it survives task replacement"
      EnableAiAssist:
        default: "Enable AI assist  [Optional, default off] — AI-assisted schema conversion via Amazon Bedrock"
      BedrockModelArns:
        default: "Bedrock model ARN(s)  [Optional] — blank = auto-derive from the model id"
      BedrockRegion:
        default: "Bedrock region  [Optional]"
      BedrockModelId:
        default: "Bedrock model id  [Optional] — Anthropic model for AI assist; IAM scope auto-derived"

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC the tool runs in (must reach the source database privately).

  AlbSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Two or more subnets (distinct AZs) for the ALB. Use public subnets for an
      internet-facing ALB, or private subnets for an internal ALB.

  ServiceSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Subnets (2+, distinct AZs recommended) the Fargate task runs in. Best
      practice is private subnets with egress via a NAT gateway / VPC endpoints.
      If your VPC has no private/NAT subnets (e.g. a default VPC), you can reuse
      the SAME public subnets as AlbSubnetIds -- in that case also set
      AssignPublicIp=ENABLED so the task can pull its image and reach AWS APIs via
      the internet gateway.

  AlbScheme:
    Type: String
    Default: internal
    AllowedValues: ["internal", "internet-facing"]
    Description: >
      ALB scheme. Default 'internal' (Well-Architected SEC05-BP02): the UI is a
      management plane operators reach over VPN / Direct Connect / a bastion, with
      no internet exposure. Use 'internet-facing' only when you genuinely need
      public reachability -- it is allowed without Cognito only when
      AllowedIngressCidr is scoped (not 0.0.0.0/0); fully open ingress requires
      EnableCognitoAuth=true. If you pick 'internet-facing', also set
      AllowedIngressCidr to your desktop public IP as x.x.x.x/32 -- leaving the
      private default (10.0.0.0/8) blocks your browser.

  CertificateArn:
    Type: String
    Description: ACM certificate ARN for the ALB HTTPS (443) listener.
    AllowedPattern: ^arn:aws[a-zA-Z-]*:acm:[a-z0-9-]+:[0-9]{12}:certificate/.+$

  # NOTE (maintainers): the default image is currently hosted in an individual AWS
  # account's ECR Public registry (alias z0q0i9j0) as an INTERIM measure. Migrate it
  # to an AWS Labs / team-owned account before/soon after publication so the default
  # survives personnel changes and reads as an official source; then repoint this
  # default and refresh the tag to the released version.
  ContainerImageUri:
    Type: String
    Default: public.ecr.aws/z0q0i9j0/mysql-dsql-migrator:0.1.417
    Description: >
      App container image URI. Defaults to the published ECR Public image, so a
      normal deploy needs NO image build -- Fargate pulls it directly (works from
      a public subnet or a private subnet with NAT/egress). Restricted-network
      customers override this with their own private ECR copy (e.g. mirrored via an
      ECR pull-through cache of public.ecr.aws; see DEPLOYMENT.md), or build from
      deploy/Dockerfile and pass that URI. Pin a tag or @sha256 digest per release.

  ContainerCpu:
    Type: Number
    Default: 512
    AllowedValues: [256, 512, 1024, 2048, 4096, 8192, 16384]
    Description: >
      Fargate task CPU units (1024 = 1 vCPU, 4096 = 4 vCPU, 16384 = 16 vCPU). Full Load
      is CPU-bound (per-row type conversion): 512 is fine for evaluation, but use 1024+
      (ideally 4096) for a real large-scale Full Load. Also gates the valid memory range.

  ContainerMemory:
    Type: Number
    Default: 1024
    Description: >
      Fargate task memory (MiB) -- a HARD limit; exceeding it OOM-kills the task with no
      app log. Memory scales with table_parallelism x batch_parallelism across worker
      processes and with wide TEXT/BLOB rows, so 1024 can be tight for a real load: use
      2048+ for a Full Load, 8192+ for large LOBs. Must be valid for the chosen CPU
      (512->1-4GB, 1024->2-8GB, 2048->4-16GB, 4096->8-30GB).

  AppPort:
    Type: Number
    Default: 8080
    MinValue: 1
    MaxValue: 65535
    Description: Port the NiceGUI app listens on inside the container.

  AssignPublicIp:
    Type: String
    Default: DISABLED
    AllowedValues: ["DISABLED", "ENABLED"]
    Description: >
      Assign a public IP to the Fargate task. Keep DISABLED for production
      (private subnets with NAT or VPC endpoints for egress). Set ENABLED only
      for a quick test in public subnets without a NAT gateway; the task still
      only accepts traffic from the ALB security group.

  AllowedIngressCidr:
    Type: String
    Default: 10.0.0.0/8
    Description: >
      CIDR allowed to reach the ALB on 443 -- match it to how you reach the UI.
      INTERNAL ALB: your VPC or VPN CIDR (e.g. 10.0.0.0/8 or 172.31.0.0/16).
      INTERNET-FACING ALB: your own desktop public IP as x.x.x.x/32 (find it with
      'curl https://checkip.amazonaws.com'). The default 10.0.0.0/8 fits an internal
      ALB only -- if you set AlbScheme=internet-facing and leave this default, your
      browser is blocked. 0.0.0.0/0 (whole internet) additionally requires
      EnableCognitoAuth=true.

  DsqlClusterArn:
    Type: String
    Description: ARN of the target Aurora DSQL cluster (scopes dsql:DbConnect / dsql:DbConnectAdmin).
    AllowedPattern: ^arn:aws[a-zA-Z-]*:dsql:[a-z0-9-]+:[0-9]{12}:cluster/.+$

  SourceSecretArn:
    Type: String
    Default: ""
    Description: >
      OPTIONAL. Secrets Manager secret ARN holding the source DB credentials, to
      REUSE an existing secret -- it scopes the task's secretsmanager:GetSecretValue
      to this secret only. Leave EMPTY (the common case) to connect the source with
      a username/password typed in the UI instead; the password stays in memory and
      no secret is read. (For CDC with username/password, the tool creates its own
      managed secret under mysql-dsql-migrator/cdc/* -- a separate scoped policy
      already covers that, independent of this parameter.) When set, must be a
      Secrets Manager secret ARN.
    AllowedPattern: ^$|^arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$

  SourceDbSecurityGroupId:
    Type: String
    Default: ""
    Description: >
      Security group id of the source RDS/Aurora MySQL. When set, the task's
      egress on the source DB port is scoped to this security group only
      (preferred). Provide this OR SourceDbCidr -- at least one is required so the
      task can reach the source; with both empty there is no DB-port egress and
      the source connection times out.

  SourceDbCidr:
    Type: String
    Default: ""
    Description: >
      Source DB CIDR, used when SourceDbSecurityGroupId is empty -- the task's
      egress on the source DB port is opened to this CIDR. Provide this OR
      SourceDbSecurityGroupId (at least one is required to reach the source).

  SourceDbPort:
    Type: Number
    Default: 3306
    MinValue: 1
    MaxValue: 65535
    Description: Source MySQL port (egress).

  HttpsEgressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >
      CIDR for outbound HTTPS (443) to reach Aurora DSQL, Secrets Manager, ECR,
      CloudWatch, and (when enabled) Bedrock via NAT. Tighten to your
      VPC-endpoint/NAT CIDR when using PrivateLink.

  EnableCognitoAuth:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      When true, the ALB authenticates users via an Amazon Cognito user pool
      (OIDC) before forwarding to the app; requires CognitoDomainPrefix. Defaults
      to false: with the recommended internal ALB (or an ALB scoped to your own
      CIDR), the network is the access gate and the operator already holds the
      IAM/DB permissions, so no login is needed. Cognito is only REQUIRED when
      AllowedIngressCidr is 0.0.0.0/0 (open to the whole internet) -- the
      template enforces that.

  AppDomainName:
    Type: String
    Default: ""
    Description: >
      OPTIONAL custom DNS name fronting the ALB (must match CertificateArn), e.g.
      mysql-dsql-migrator.example.internal. Leave EMPTY to use the ALB's own DNS
      name as the Cognito callback host -- then no custom domain / Route 53 record
      is needed. Set it only if you front the ALB with your own domain.

  CognitoDomainPrefix:
    Type: String
    Default: ""
    Description: >
      Globally-unique prefix for the Cognito hosted-UI domain
      (https://<prefix>.auth.<region>.amazoncognito.com). Required when
      EnableCognitoAuth=true.

  CognitoAdminEmail:
    Type: String
    Default: ""
    Description: >
      Email address of the FIRST login user, created by this stack when
      EnableCognitoAuth=true. Cognito emails a temporary password to it; the hosted
      UI then asks for a new one on first sign-in. Required with Cognito, because the
      user pool disables self sign-up (AllowAdminCreateUserOnly) -- without this the
      deploy succeeds and produces an app NOBODY CAN LOG IN TO. Add more users later
      with: aws cognito-idp admin-create-user --user-pool-id <UserPoolId output>
      --username <email> --user-attributes Name=email,Value=<email>
      Name=email_verified,Value=true --desired-delivery-mediums EMAIL

  EnableActivityLogCloudWatch:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      When true, the app mirrors each activity-log event to stdout as a JSON line,
      which the container's awslogs driver forwards to this stack's CloudWatch log
      group -- a durable, queryable audit trail that survives task replacement (the
      rotating file lives on the task's ephemeral /tmp). Off by default; the local
      rotating file remains regardless. No extra IAM or log group is needed (the
      task already logs to CloudWatch via awslogs).

  EnableAiAssist:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Opt-in AI-assisted conversion. When false, bedrock:InvokeModel is NOT
      granted. When true, it is granted scoped to Anthropic models (or to
      BedrockModelArns when that override is set).

  BedrockModelArns:
    Type: CommaDelimitedList
    Default: ""
    Description: >
      OPTIONAL override of the foundation-model/inference-profile ARN(s) the task
      role may invoke when EnableAiAssist=true. Leave EMPTY (default) for the
      provider-scoped default (any Anthropic model, so the UI can switch models
      without a redeploy). Set it to NARROW the scope to specific ARN(s), or to
      allow a NON-Anthropic model (comma-separated ARNs).

  BedrockRegion:
    Type: String
    Default: ""
    Description: AWS region for Bedrock calls (BEDROCK_REGION). Optional.

  BedrockModelId:
    Type: String
    # SHOULD match DEFAULT_BEDROCK_MODEL_ID in src/dsql_migrator/ui/ai_assist.py: this is
    # the model the app STARTS with (it seeds the Connect form's Model ID and the app
    # falls back to it when that field is blank). The IAM scope below is provider-wide
    # (any Anthropic model), NOT derived from this value, so switching the UI Model ID to
    # another Anthropic model no longer needs a redeploy and no longer risks the
    # AccessDenied-looking mismatch this used to cause. It still must be a model the
    # account has ENABLED (else the call fails MODEL_NOT_ENABLED).
    #
    # Every allowed value is a `global.` profile, which resolves from any commercial
    # region. The `us.` profiles this list used to offer only resolve from
    # us-east-1/us-east-2/us-west-2, so they broke every non-US deploy out of the box
    # while adding nothing for US ones -- `global.` works there too (verified).
    Default: global.anthropic.claude-sonnet-5
    AllowedValues:
      # GLOBAL cross-region inference profiles ONLY. These resolve from every commercial
      # region -- verified against us-east-1, us-west-2 and ap-northeast-2 -- so the `us.`
      # equivalents this list used to carry bought nothing: they work in three US regions
      # and fail everywhere else, which is a trap rather than a choice. One geo prefix also
      # keeps the derived IAM scope and the app default from drifting per deploy region.
      - global.anthropic.claude-sonnet-5
      - global.anthropic.claude-opus-5
      - global.anthropic.claude-opus-4-8
      - global.anthropic.claude-sonnet-4-6
    Description: >
      Anthropic cross-region inference profile the app STARTS with for AI-assisted
      conversion (BEDROCK_MODEL_ID). Every option is a `global.` profile, which
      resolves from any commercial region -- including ap-northeast-2/Seoul and eu-*.
      When EnableAiAssist=true, the task role may invoke ANY Anthropic model
      (provider-scoped), so you can switch the Model ID in the UI without a redeploy
      and do not need to supply BedrockModelArns. This value is just the default the
      UI opens with. Any model you use must be access-enabled in your account/region.

# Reject insecure deployment combinations at create/update time (before any
# resource is provisioned). The app enforces NO auth of its own -- it relies on
# the ALB's Cognito gate -- so an internet-facing ALB with Cognito disabled, or an
# open 0.0.0.0/0 ingress with Cognito disabled, would expose the full migration
# control plane (start Full Load, apply DDL to DSQL, deploy/tear down CDC, read the
# configured endpoints/secret ARNs) to anyone who can reach it.
Rules:
  # The app performs no authentication itself; the network gate (ALB scheme +
  # AllowedIngressCidr) is what decides who can reach the control plane. Cognito
  # is therefore required only when ingress is open to the whole internet
  # (0.0.0.0/0) -- in every other case the operator has already scoped access to a
  # trusted CIDR (e.g. their own IP/VPN/office), which is a sufficient gate for an
  # operator who already holds the IAM/DB permissions, so Cognito stays OPTIONAL.
  # This keeps the common deploy simple: internet-facing ALB + your-IP CIDR + no
  # Cognito = browse the ALB URL directly, no login/domain/user setup.
  CognitoRequiredWhenIngressOpen:
    RuleCondition:
      Fn::Equals: [Ref: AllowedIngressCidr, "0.0.0.0/0"]
    Assertions:
      - Assert:
          Fn::Equals: [Ref: EnableCognitoAuth, "true"]
        AssertDescription: >-
          AllowedIngressCidr=0.0.0.0/0 (open to the whole internet) requires
          EnableCognitoAuth=true, because the app has no auth of its own. Either
          enable Cognito, or tighten AllowedIngressCidr to your own network/IP CIDR
          (a scoped CIDR is a sufficient gate and needs no Cognito).

  # Cognito needs BOTH a hosted-UI domain and a first user. The pool sets
  # AllowAdminCreateUserOnly (no self sign-up), so with no user the deploy SUCCEEDS and
  # hands back a URL that redirects to a login screen with no account to use -- an app
  # nobody can log in to, discovered only when someone tries. Assert both here so that
  # is a deploy-time error instead.
  CognitoNeedsDomainAndFirstUser:
    RuleCondition:
      Fn::Equals: [Ref: EnableCognitoAuth, "true"]
    Assertions:
      - Assert:
          Fn::Not:
            - Fn::Equals: [Ref: CognitoDomainPrefix, ""]
        AssertDescription: >-
          EnableCognitoAuth=true requires CognitoDomainPrefix (the globally-unique
          hosted-UI domain prefix users are redirected to for sign-in).
      - Assert:
          Fn::Not:
            - Fn::Equals: [Ref: CognitoAdminEmail, ""]
        AssertDescription: >-
          EnableCognitoAuth=true requires CognitoAdminEmail. The user pool disables
          self sign-up, so without a first user the deploy would produce an app nobody
          can log in to. Cognito emails a temporary password to this address.

  # The Fargate task must have an egress path to the source MySQL on SourceDbPort,
  # or it can never connect (the UI's source connection times out). That path is
  # opened by EITHER SourceDbSecurityGroupId (preferred -- task egress scoped to
  # the source DB's security group) OR SourceDbCidr. If BOTH are left empty, no
  # DB-port egress rule is created at all, so require at least one here -- a clear
  # deploy-time failure instead of a silently unreachable source at runtime.
  SourceReachabilityRequired:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::Not:
                - Fn::Equals: [Ref: SourceDbSecurityGroupId, ""]
            - Fn::Not:
                - Fn::Equals: [Ref: SourceDbCidr, ""]
        AssertDescription: >-
          Provide SourceDbSecurityGroupId (preferred) or SourceDbCidr so the
          Fargate task gets egress to the source MySQL on SourceDbPort. With both
          empty the task has no route to the source DB and connections time out.

Conditions:
  CognitoEnabled:
    Fn::Equals: [Ref: EnableCognitoAuth, "true"]

  # When AppDomainName is left empty, the Cognito callback URL falls back to the
  # ALB's own DNS name -- so a customer can use the raw ALB URL with Cognito auth
  # and needs NO custom domain / Route 53 / hosts entry (deployment convenience).
  HasAppDomainName:
    Fn::Not:
      - Fn::Equals: [Ref: AppDomainName, ""]

  AiAssistEnabled:
    Fn::Equals: [Ref: EnableAiAssist, "true"]

  # True when the operator supplied explicit BedrockModelArns; otherwise the IAM
  # scope is auto-derived from BedrockModelId. BedrockModelArns is a
  # CommaDelimitedList, so join it and compare to "" to detect the empty default.
  HasBedrockModelArnsOverride:
    Fn::Not:
      - Fn::Equals:
          - Fn::Join: ["", Ref: BedrockModelArns]
          - ""

  # SourceSecretArn is optional: set only to reuse an existing Secrets Manager
  # secret. When empty (username/password auth in the UI), the read-source-secret
  # GetSecretValue policy below is omitted -- nothing to read.
  HasSourceSecret:
    Fn::Not:
      - Fn::Equals: [Ref: SourceSecretArn, ""]

  UseSourceDbSecurityGroup:
    Fn::Not:
      - Fn::Equals: [Ref: SourceDbSecurityGroupId, ""]

  UseSourceDbCidr:
    Fn::And:
      - Fn::Equals: [Ref: SourceDbSecurityGroupId, ""]
      - Fn::Not:
          - Fn::Equals: [Ref: SourceDbCidr, ""]

Resources:
  # No KmsKeyId, deliberately (CKV_AWS_158 / CLOUDWATCH_LOG_GROUP_ENCRYPTED). Do NOT
  # "fix" this with the argument used for the ECR repository in codebuild.yaml -- that
  # one is free because aws/ecr exists, whereas CloudWatch Logs has NO AWS-managed key
  # (verified: describe-key alias/aws/logs -> NotFoundException; the account's
  # alias/aws/* list has no logs entry). So the only real encryption here is a
  # customer-managed key, and that is what is being declined, at ~$1/month plus a
  # deploy-time cost that hits the customer, not us: creating the key needs
  # kms:CreateKey on the DEPLOYING principal, which AWS's service reference shows
  # supports no resource-level scoping, so a customer deploying under a scoped role
  # would have to widen it (DEPLOYMENT.md lists what the deployer needs today). The
  # key would also outlive teardown in PendingDeletion. Accepted because the content
  # does not warrant it: this group holds the app's own stdout for one operator, it is
  # already encrypted at rest with an AWS-owned key, retention is bounded to 30 days,
  # and credentials never reach it (Property 7 -- they live in process memory only).
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /ecs/${AWS::StackName}-mysql-dsql-migrator
      RetentionInDays: 30

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName:
        Fn::Sub: ${AWS::StackName}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # Stable secret used to sign the UI's browser-session cookie
  # (DSQL_MIGRATOR_STORAGE_SECRET). Auto-generated once and held in Secrets
  # Manager so the browser session id stays stable across task restarts/redeploys
  # -- this lets a reconnecting browser resume its persisted workbench state
  # (workflow progress, Evaluation result, Full Load linkage) instead of
  # re-running Step 1. It only signs the session cookie; no DB/user credentials
  # are stored here. Note: per-session SQLite state still lives on the task's
  # ephemeral storage, so restoration across a full task *replacement* also needs
  # durable storage (out of scope for this stack).
  # No KmsKeyId, deliberately (CKV_AWS_149 / SECRETSMANAGER_USING_CMK): this stays on
  # the AWS-managed aws/secretsmanager key. What is being declined is a customer-
  # managed key, which is possible but not free here -- it costs ~$1/month, the
  # ExecutionRole then needs kms:Decrypt on it or the container cannot start at all
  # (Secrets Manager requires the CALLER to hold it for a CMK, unlike the AWS-managed
  # key), and the deploying principal needs kms:CreateKey, which cannot be scoped to a
  # resource. Accepted because of what this value IS: 64 random characters generated by
  # CloudFormation that sign the session cookie and keep the browser id stable. It is
  # not customer data, it never leaves the account, and the only reader is the
  # ExecutionRole below. Where credentials ARE involved the tool already supports a
  # CMK: the source-database secret it creates at CDC start honours
  # DSQL_MIGRATOR_CDC_SECRET_KMS_KEY_ID (config.py -> core/secrets.py KmsKeyId).
  # NOT an option: setting KmsKeyId to "alias/aws/secretsmanager" makes the scanner
  # pass (its check is `"aws/" not in KmsKeyId`, which a dict value never matches)
  # while changing nothing about encryption. That is gaming the check, not a fix.
  StorageSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description:
        Fn::Sub: "${AWS::StackName} UI session cookie signing secret."
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # Execution role: pull the image from ECR, write logs, and read the
  # auto-generated storage secret to inject it into the container at start.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-storage-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: GetStorageSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Ref: StorageSecret

  # Task role: the app's own runtime permissions (least privilege).
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: dsql-connect
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DsqlConnect
                Effect: Allow
                # The app connects as the DSQL "admin" role by default, whose
                # IAM auth token requires dsql:DbConnectAdmin; dsql:DbConnect
                # covers connecting as a non-admin database role. Both are scoped
                # to this cluster only.
                Action:
                  - dsql:DbConnect
                  - dsql:DbConnectAdmin
                Resource:
                  Ref: DsqlClusterArn
              - Sid: DsqlClusterMetadata
                Effect: Allow
                # Read-only metadata used by the overview diagram to show the
                # cluster's "Name" tag (falls back to the cluster id without it).
                # Scoped to this cluster only.
                Action:
                  - dsql:GetCluster
                  - dsql:ListTagsForResource
                Resource:
                  Ref: DsqlClusterArn
        # Only when an existing SourceSecretArn is provided (reuse path). With
        # username/password auth the parameter is empty and this policy is omitted.
        - Fn::If:
            - HasSourceSecret
            - PolicyName: read-source-secret
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Sid: GetSourceSecret
                    Effect: Allow
                    Action: secretsmanager:GetSecretValue
                    Resource:
                      Ref: SourceSecretArn
            - Ref: AWS::NoValue
        - PolicyName: provision-cdc-source-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # When the source was connected with username/password (no Secrets
              # Manager reference to reuse), the tool creates/upserts a managed
              # source-credentials secret for the CDC connector (Debezium can only
              # read source creds from Secrets Manager). Names are deterministic
              # (mysql-dsql-migrator/cdc/<stack-name>/source), so write access is scoped
              # to that prefix only -- never the customer's other secrets.
              - Sid: ProvisionCdcSourceSecret
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:PutSecretValue
                  - secretsmanager:DescribeSecret
                  # RestoreSecret so the upsert can recover a same-named secret that
                  # a prior CDC teardown scheduled for deletion (still in its recovery
                  # window): AWS rejects CreateSecret/PutSecretValue while it is
                  # pending deletion, so secrets.py restores it first, then writes the
                  # new value. Without this the app fails with AccessDenied on
                  # RestoreSecret when re-provisioning after a teardown. Same prefix scope.
                  - secretsmanager:RestoreSecret
                  # DeleteSecret so a full CDC teardown removes the credentials the
                  # tool stored (they do not belong to a CloudFormation resource, so
                  # delete-stack cannot clean them up). Scoped to the same prefix.
                  - secretsmanager:DeleteSecret
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:mysql-dsql-migrator/cdc/*
              # NOTE: when DSQL_MIGRATOR_CDC_SECRET_KMS_KEY_ID is set to a customer-
              # managed KMS key, that key's policy (or an additional grant) must let
              # this TaskRole kms:GenerateDataKey + kms:Decrypt. It is not granted
              # here because the CMK ARN is not known at app-stack deploy time; with
              # the default aws/secretsmanager key no extra grant is needed.
        - PolicyName: cdc-deploy-discovery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Subnet auto-select for the CDC infra deploy reads VPC topology.
              # EC2 Describe* + sts:GetCallerIdentity do not support resource-level
              # scoping, so they are "*" but are strictly read-only.
              - Sid: DiscoverConnectorSubnets
                Effect: Allow
                Action:
                  - ec2:DescribeSubnets
                  - ec2:DescribeRouteTables
                  - ec2:DescribeVpcs
                  # DescribeNetworkInterfaces: during a CDC infrastructure DELETE, the
                  # in-VPC offset-seeder Lambda's ENIs are reclaimed by AWS over
                  # ~15-20 min before MskCluster can be removed, and CloudFormation
                  # emits no events for that wait -- so the deploy log looks frozen.
                  # Reading the seeder's ENIs lets the delete progress report "still
                  # reclaiming N ENIs" / "ENIs released" and fill that gap. Read-only,
                  # no resource-level scoping (like the other Describe* above).
                  - ec2:DescribeNetworkInterfaces
                Resource: "*"
              - Sid: CallerIdentity
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: "*"
              # The task role itself (NOT the assumed deploy role) polls connector
              # state to drive the CDC UI: it lists connectors to find one by name
              # and waits for RUNNING before starting the sink pass. Without
              # ListConnectors the read silently returns nothing (the call is
              # AccessDenied and swallowed), so a connector that is actually RUNNING
              # shows "creating…" forever and the sink pass never starts.
              # ListConnectors has no resource-level support (Resource "*");
              # DescribeConnector is scoped to the cdc connector family.
              - Sid: DiscoverCdcConnectors
                Effect: Allow
                Action: kafkaconnect:ListConnectors
                Resource: "*"
              - Sid: DescribeCdcConnectors
                Effect: Allow
                Action: kafkaconnect:DescribeConnector
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:kafkaconnect:${AWS::Region}:${AWS::AccountId}:connector/mysql-dsql-cdc-*/*
              # Read the pipeline's CloudWatch metrics for the live health panel:
              # the built-in AWS/KafkaConnect throughput/task metrics
              # (SinkRecordSendRate, SourceRecordPollRate, Running/ErroredTaskCount)
              # AND the sink's per-table net-rows custom metric. ListMetrics discovers
              # the sink's actual per-table dimension values (the sink emits the Table
              # dimension schema-qualified, e.g. db.table) so the monitor matches them
              # to the tool's table names regardless of single-db vs cluster naming.
              # Neither API has resource-level scoping, so both are granted on "*"
              # (like ListConnectors).
              - Sid: ReadConnectorMetrics
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                Resource: "*"
              # Read connector worker logs to surface an actionable reason when a
              # connector enters FAILED (worker-log-driven diagnosis in the UI) and
              # to surface DLQ poison-record events in the data-migration status page.
              # FilterLogEvents backs the DLQ depth / "Quarantined records" read
              # (MskConnectController.dlq_errors); without it that read fails closed
              # (AccessDenied is swallowed) and the UI always shows an empty DLQ.
              - Sid: ReadConnectorWorkerLogs
                Effect: Allow
                Action:
                  - logs:DescribeLogStreams
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/msk-connect/mysql-dsql-cdc-*:*
              # The tool manages a single per-account/region plugin bucket
              # (mysql-dsql-migrator-plugins-<account>-<region>). It holds the two
              # bundled connector artifacts, the durable per-session resume snapshots
              # (sessions/ prefix), AND the durable Full Load job snapshots (jobs/
              # prefix). CreateBucket makes it self-provisioning; ListBucket backs
              # snapshot pruning; the object-level grant on /* covers both prefixes
              # (incl. head_object via s3:GetObject). Scoped to that bucket only.
              - Sid: ManagePluginBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:ListBucket
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::mysql-dsql-migrator-plugins-${AWS::AccountId}-${AWS::Region}
              # PutObject/GetObject: upload plugins + read/write session snapshots.
              # DeleteObject: remove a session on "Start over" and prune old ones.
              - Sid: UploadPlugins
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::mysql-dsql-migrator-plugins-${AWS::AccountId}-${AWS::Region}/*
              # The privileged cdc-stack CloudFormation/MSK/IAM operations are NOT
              # granted to this (long-running) task role. Instead the task assumes
              # the dedicated CdcDeployRole only for the duration of a deploy. The
              # resource is the role's known name (NOT a GetAtt) to avoid a circular
              # dependency with CdcDeployRole's trust policy (which GetAtt's this role).
              - Sid: AssumeCdcDeployRole
                Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-cdc-deploy

  # Dedicated privileged role the task assumes ONLY for cdc-stack lifecycle (keeps
  # CFN/MSK/iam:CreateRole/PassRole off the long-running task role). Explicit
  # RoleName breaks the trust-policy cycle with TaskRole. IAM is scoped to the
  # "mysql-dsql-cdc-*" stack-name family so one role manages all cdc-stacks (names
  # are validated to start with that prefix; see core/cdc.py). NOTE: the parent app
  # stack must NOT use a "mysql-dsql-cdc-" name or its resources fall in scope.
  CdcDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${AWS::StackName}-cdc-deploy
      Description: >-
        Privileged role assumed by the ECS task only for cdc-stack CloudFormation
        lifecycle (create/update/delete). Holds CFN/MSK/KafkaConnect/Glue/EC2-SG/
        Logs/IAM-create + scoped PassRole permissions that are intentionally NOT on
        the task role.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowTaskRoleToAssume
            Effect: Allow
            Principal:
              AWS:
                Fn::GetAtt: [TaskRole, Arn]
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cdc-stack-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CloudFormation: create/update/delete + poll the cdc-stack.
              - Sid: CloudFormationStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/mysql-dsql-cdc-*/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/mysql-dsql-cdc-*
              # ValidateTemplate + ListStacks have no stack ARN (they are account/
              # region-wide); read-only. ListStacks lets the CDC screen discover an
              # existing mysql-dsql-cdc-* stack that a reset session no longer
              # remembers, so it can adopt it instead of silently creating a second
              # (costly) MSK stack. Names are filtered to the cdc family client-side.
              - Sid: CloudFormationAccountReads
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:ListStacks
                Resource: "*"
              # Stage the oversize cdc-stack template in the plugin bucket: this role
              # does the PutObject; CloudFormation reads it back (TemplateURL) too.
              - Sid: StageCdcStackTemplate
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::mysql-dsql-migrator-plugins-${AWS::AccountId}-${AWS::Region}/cdc-plugins/*
              # MSK Serverless cluster (CFN AWS::MSK::ServerlessCluster) +
              # GetBootstrapBrokers (called directly by the deployer at Start).
              - Sid: MskServerlessCluster
                Effect: Allow
                Action:
                  - kafka:CreateClusterV2
                  - kafka:DeleteCluster
                  - kafka:DescribeClusterV2
                  - kafka:GetBootstrapBrokers
                  - kafka:TagResource
                  - kafka:UntagResource
                  - kafka:ListTagsForResource
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:cluster/mysql-dsql-cdc-*-msk/*
              # MSK Connect connector CREATE has NO resource-level support: at
              # create time the connector ARN does not exist yet, so IAM evaluates
              # kafkaconnect:CreateConnector against "*" -- a scoped connector ARN
              # (like the operations below) makes CreateConnector fail with
              # "Access denied for operation 'AWS::KafkaConnect::Connector'". Same
              # class as CreateCustomPlugin / CreateWorkerConfiguration just below,
              # which are already "*" for this reason. Tagging on create is covered
              # by the TagResource here (also no resource-level support at create).
              - Sid: KafkaConnectCreateConnector
                Effect: Allow
                Action:
                  - kafkaconnect:CreateConnector
                  - kafkaconnect:TagResource
                Resource: "*"
              # ListConnectors is an ACCOUNT-LEVEL list operation (authorized against
              # .../v1/connectors), so it cannot be resource-scoped -- it must be "*"
              # (same as the task role's DiscoverCdcConnectors grant). run_cdc_start /
              # run_cdc_stop list connectors to read source/sink state during the
              # two-pass start and the stop. A connector-ARN scope silently grants
              # nothing, so the deployer got AccessDeniedException on ListConnectors.
              - Sid: KafkaConnectListConnectors
                Effect: Allow
                Action: kafkaconnect:ListConnectors
                Resource: "*"
              # MSK Connect connector operations that DO support resource-level
              # scoping (the connector ARN exists by then): scope to the cdc family.
              - Sid: KafkaConnectConnector
                Effect: Allow
                Action:
                  - kafkaconnect:DeleteConnector
                  - kafkaconnect:DescribeConnector
                  - kafkaconnect:UpdateConnector
                  - kafkaconnect:UntagResource
                  - kafkaconnect:ListTagsForResource
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:kafkaconnect:${AWS::Region}:${AWS::AccountId}:connector/mysql-dsql-cdc-*/*
              # UpdateConnector is asynchronous: it returns a connector-operation id
              # that the CFN handler polls with DescribeConnectorOperation. AWS
              # authorizes that poll against BOTH ARN shapes depending on the call
              # path -- the connector ARN (connector/<name>/<uuid>) AND the
              # per-operation ARN (connector-operation/<name>/<uuid>/<op-uuid>) --
              # so BOTH must be granted or the CDC retry rolls back with "not
              # authorized to perform kafkaconnect:DescribeConnectorOperation"
              # (observed on each shape in turn as the scope was narrowed).
              - Sid: KafkaConnectConnectorOperation
                Effect: Allow
                Action:
                  - kafkaconnect:DescribeConnectorOperation
                  - kafkaconnect:ListConnectorOperations
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:kafkaconnect:${AWS::Region}:${AWS::AccountId}:connector/mysql-dsql-cdc-*/*
                  - Fn::Sub: arn:${AWS::Partition}:kafkaconnect:${AWS::Region}:${AWS::AccountId}:connector-operation/mysql-dsql-cdc-*/*
              # CustomPlugin + WorkerConfiguration, split by what IAM can scope.
              #
              # The CREATE actions have no resource-level support (verified in AWS's
              # service reference: kafkaconnect:CreateCustomPlugin /
              # CreateWorkerConfiguration / CreateConnector / ListConnectors list no
              # resource types), and the CFN handlers tag + read tags as part of that
              # same create call -- with the ARN not yet in existence -- so the tagging
              # actions stay here too rather than being scoped: narrowing them returned
              # AccessDenied on create when it was tried.
              - Sid: KafkaConnectCreateAndTag
                Effect: Allow
                Action:
                  - kafkaconnect:CreateCustomPlugin
                  - kafkaconnect:CreateWorkerConfiguration
                  - kafkaconnect:TagResource
                  - kafkaconnect:UntagResource
                  - kafkaconnect:ListTagsForResource
                Resource: "*"
              # Everything that runs AFTER the resource exists takes an ARN, so it is
              # scoped to the cdc family -- the same pattern as KafkaConnectConnector
              # above. Confirmed with iam:SimulateCustomPolicy: allowed for
              # custom-plugin/mysql-dsql-cdc-<stack>-…/<uuid>, implicitDeny for a
              # plugin belonging to anything else in the account.
              - Sid: KafkaConnectPluginOps
                Effect: Allow
                Action:
                  - kafkaconnect:DeleteCustomPlugin
                  - kafkaconnect:DescribeCustomPlugin
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:kafkaconnect:${AWS::Region}:${AWS::AccountId}:custom-plugin/mysql-dsql-cdc-*/*
              - Sid: KafkaConnectWorkerConfigOps
                Effect: Allow
                Action:
                  - kafkaconnect:DeleteWorkerConfiguration
                  - kafkaconnect:DescribeWorkerConfiguration
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:kafkaconnect:${AWS::Region}:${AWS::AccountId}:worker-configuration/mysql-dsql-cdc-*/*
              # EC2 networking the cdc-stack creates (SG, and when ConnectorSubnetIds
              # is empty its own subnets/NAT/route table).
              #
              # These writes ARE resource-scopable, contrary to what this comment used
              # to claim: every action below lists resource types in AWS's
              # machine-readable service reference (servicereference.us-east-1
              # .amazonaws.com/v1/ec2/ec2.json), so they are pinned to the nine types
              # the cdc-stack actually creates or touches, in this account and region.
              # Verified with iam:SimulateCustomPolicy -- all 28 actions resolve to
              # "allowed" against an ARN of the type they create, while the same
              # actions against another account, another region, or another resource
              # type (ec2:DeleteVpc, ec2:RunInstances) resolve to implicitDeny. A
              # specific VPC/subnet ARN still cannot be pinned: the operator supplies
              # the VPC as a cdc-stack parameter long after this role is created, so
              # account+region+type is the narrowest form available at that point.
              #
              # Resource types deliberately omitted -- they are only evaluated for
              # parameters this stack never passes: ipam-pool / ipv4pool-ec2 /
              # ipv6pool-ec2 (IPAM and BYOIP allocation), internet-gateway /
              # vpn-gateway (route-table association targets; our one route points at
              # the NAT gateway). Using any of them in cdc-stack.yaml means adding its
              # ARN here, or the deploy fails with AccessDenied.
              - Sid: Ec2NetworkResources
                Effect: Allow
                Action:
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:AllocateAddress
                  - ec2:ReleaseAddress
                  - ec2:CreateNatGateway
                  - ec2:DeleteNatGateway
                  - ec2:CreateVpcEndpoint
                  - ec2:DeleteVpcEndpoints
                  - ec2:ModifyVpcEndpoint
                  # Takes a vpc ARN, so it belongs with the scoped writes rather than
                  # the account-wide Describe* block below.
                  - ec2:DescribeVpcAttribute
                  # When MSK Connect creates the connector it places the connector's
                  # ENIs in the connector subnets USING THE CALLER'S (this deploy
                  # role's) credentials -- CloudTrail shows CreateNetworkInterface
                  # called by kafkaconnect.amazonaws.com but authorized against
                  # <stack>-cdc-deploy, not the connector's ServiceExecutionRole or
                  # the MSK Connect service-linked role. Without these the connector
                  # CREATE fails with "not authorized to perform
                  # ec2:CreateNetworkInterface" (AWS::KafkaConnect::Connector
                  # InvalidRequest). The create is authorized against the
                  # network-interface / subnet / security-group ARNs in the scoped list
                  # below (confirmed with iam:SimulateCustomPolicy), so it does not
                  # need Resource "*" -- only the Describe* call does.
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:CreateNetworkInterfacePermission
                  # Tag-on-create and teardown untagging, on the same resources.
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group-rule/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:natgateway/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc-endpoint/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
              # EC2 Describe* has NO resource-level form (same service reference), so
              # these reads stay account-wide -- a scoped ARN would silently grant
              # nothing. All read-only: subnet auto-select reads the VPC topology, and
              # the CDC teardown progress report reads the seeder Lambda's ENIs while
              # AWS reclaims them. ec2:DescribeVpcAttribute is the one Describe that
              # DOES take an ARN, so it sits in the scoped statement above.
              - Sid: Ec2NetworkReads
                Effect: Allow
                Action:
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeRouteTables
                  - ec2:DescribeAddresses
                  - ec2:DescribeNatGateways
                  - ec2:DescribeVpcEndpoints
                  - ec2:DescribeVpcs
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeNetworkInterfaces
                  # CloudFormation reads back each security-group RULE it just authorized
                  # (one call per AWS::EC2::SecurityGroupIngress/Egress) and the VPC's
                  # network ACLs before creating the SG. Neither was ever granted, so both
                  # were DENIED on every real deploy -- CloudTrail on the live Seoul stack
                  # shows Client.UnauthorizedOperation for DescribeSecurityGroupRules and
                  # DescribeNetworkAcls, invokedBy cloudformation.amazonaws.com, on both
                  # create and delete. The deploy survives (CFN falls back to the
                  # Authorize* response for the rule ids), but it leaves AccessDenied in
                  # every customer's trail and depends on that undocumented tolerance.
                  # Read-only, and neither has a resource-level form.
                  - ec2:DescribeSecurityGroupRules
                  - ec2:DescribeNetworkAcls
                Resource: "*"
              # Connector worker log group (CFN AWS::Logs::LogGroup).
              - Sid: ConnectorLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:TagLogGroup
                  - logs:TagResource
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/msk-connect/mysql-dsql-cdc-*-cdc:*
              # logs:DescribeLogGroups has no resource-level support; CFN calls it to
              # resolve the LogGroup Arn for !GetAtt. Scope to account/region log groups.
              - Sid: LogGroupDescribe
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              # The connector enables CloudWatch worker-log delivery
              # (workerLogDelivery.cloudWatchLogs.enabled=true). MSK Connect sets that
              # up via the CloudWatch Logs vended-logs *delivery* API using the
              # CALLER'S (this deploy role's) credentials -- without these the
              # connector goes to FAILED with InvalidInput.WorkerLogsError ("not
              # authorized to perform logs:ListLogDeliveries"), and no worker logs are
              # ever written. These delivery actions have no resource-level support,
              # so Resource is "*" (the AWS-documented vended-logs set for a
              # CloudWatch Logs destination).
              - Sid: CloudWatchLogsLogDelivery
                Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                Resource: "*"
              # The cdc-stack creates a CloudWatch alarm per connector on
              # AWS/KafkaConnect ErroredTaskCount (to surface a FAILED connector
              # automatically). THIS deploy role creates/updates/deletes those alarms,
              # so it needs the alarm actions -- without them the cdc-stack deploy
              # fails creating the alarm with AccessDenied (cloudwatch:PutMetricAlarm)
              # and its rollback fails on cloudwatch:DeleteAlarms. PutMetricAlarm /
              # DeleteAlarms + tagging support resource-level scoping (alarm ARN, cdc
              # family, matching the log-group scoping above); DescribeAlarms does not.
              - Sid: CdcConnectorAlarms
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:mysql-dsql-cdc-*
              # cloudwatch:DescribeAlarms DOES take an alarm ARN (AWS service
              # reference), contrary to the earlier note here, so it is scoped to the
              # same cdc alarm family as the writes above. CFN calls it to read the
              # alarm state on create/update. Confirmed with iam:SimulateCustomPolicy:
              # allowed for alarm:mysql-dsql-cdc-…, implicitDeny for any other alarm.
              - Sid: CdcConnectorAlarmsDescribe
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:mysql-dsql-cdc-*
              # IAM roles the cdc-stack auto-names (connector exec role + seeder role).
              # NOTE the deliberate absence of iam:AttachRolePolicy here -- see the next
              # statement. Together with iam:PassRole below and lambda:CreateFunction /
              # InvokeFunction further down, an unrestricted AttachRolePolicy on this role
              # family was a privilege-escalation path to account administrator: create
              # mysql-dsql-cdc-<anything>, attach AdministratorAccess, pass the role to a
              # Lambda this role may also create, invoke it. Nothing in the product needs
              # that, and no scanner rule flags it now that the wildcards are scoped, so it
              # is closed here explicitly rather than left to be re-derived.
              - Sid: IamCdcStackRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListAttachedRolePolicies
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/mysql-dsql-cdc-*
              # The cdc-stack attaches exactly ONE managed policy: the seeder Lambda's
              # AWSLambdaVPCAccessExecutionRole (deploy/cdc-stack/cdc-stack.yaml, the only
              # ManagedPolicyArns in the template). So Attach/DetachRolePolicy is granted
              # only for that policy ARN. Verified with iam:SimulateCustomPolicy: attaching
              # AWSLambdaVPCAccessExecutionRole -> allowed, while AdministratorAccess and
              # PowerUserAccess -> implicitDeny. iam:PolicyARN is a documented condition key
              # for both actions (AWS service reference).
              # RESIDUAL, knowingly accepted for now: iam:PutRolePolicy above can still
              # write an inline policy of any content onto a mysql-dsql-cdc-* role, and IAM
              # offers no policy-content condition for it -- only iam:PermissionsBoundary.
              # Closing that means giving the cdc-stack roles a boundary policy and
              # conditioning CreateRole/PutRolePolicy on it, which spans both stacks; it is
              # tracked separately rather than bolted on here.
              - Sid: IamCdcStackManagedPolicy
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/mysql-dsql-cdc-*
                Condition:
                  ArnEquals:
                    iam:PolicyARN:
                      Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
              # PassRole each cdc-stack role only to its service (MSK Connect / Lambda).
              - Sid: IamPassRoleToCdcServices
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/mysql-dsql-cdc-*
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - kafkaconnect.amazonaws.com
                      - lambda.amazonaws.com
              # Offset-seeder Lambda (SeedOffset only): in-VPC <stack>-offset-seeder,
              # invoked by a custom resource to seed the Debezium offset.
              - Sid: LambdaOffsetSeeder
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:InvokeFunction
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:mysql-dsql-cdc-*
              # CustomPlugin reads the plugin artifact from the managed bucket.
              - Sid: ReadPluginArtifacts
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::mysql-dsql-migrator-plugins-${AWS::AccountId}-${AWS::Region}/*

  # Granted only when AI assist is enabled; scoped to the allowed model ARN(s).
  BedrockInvokePolicy:
    Type: AWS::IAM::Policy
    Condition: AiAssistEnabled
    Properties:
      PolicyName: bedrock-invoke-model
      Roles:
        - Ref: TaskRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: BedrockInvokeModel
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource:
              # Explicit BedrockModelArns override, else a PROVIDER-SCOPED default:
              # ANY Anthropic model the account may invoke -- so the operator can
              # switch the UI "Model ID" among Anthropic models (current OR future)
              # WITHOUT redeploying to widen this policy. Two ARNs cover both invoke
              # shapes, both pinned to the `anthropic.` provider:
              #   1) inference-profile/*.anthropic.* -- any geo cross-region profile
              #      (global./us./apac.anthropic.<model>) in THIS account, any region;
              #   2) foundation-model/anthropic.*    -- any Anthropic foundation model,
              #      any region (foundation-model ARNs are AWS-owned: no account id).
              # The provider stays pinned to `anthropic.`, so non-Anthropic / image /
              # Marketplace models are NEVER invokable (the app only speaks the
              # Anthropic Messages body anyway), and it is never a blanket `*`. The
              # region is `*` on BOTH so a BedrockRegion different from the deploy
              # region still resolves (the "Region" field on the Connect form).
              # NB: broad IAM does NOT bypass account-level Bedrock model access --
              # each model must still be enabled in the account/region (otherwise the
              # call fails MODEL_NOT_ENABLED, not AccessDenied). Set BedrockModelArns
              # to narrow this to specific ARN(s) or to allow a non-Anthropic model.
              Fn::If:
                - HasBedrockModelArnsOverride
                - Ref: BedrockModelArns
                - - Fn::Sub: arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*.anthropic.*
                  - Fn::Sub: arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.*

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress on 443 from the allowed network; egress to the app.
      VpcId:
        Ref: VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp:
            Ref: AllowedIngressCidr
          Description: HTTPS from the allowed network.

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Fargate task SG: inbound only from the ALB; egress to source DB and AWS endpoints over HTTPS."
      VpcId:
        Ref: VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort:
            Ref: AppPort
          ToPort:
            Ref: AppPort
          SourceSecurityGroupId:
            Fn::GetAtt: [AlbSecurityGroup, GroupId]
          Description: App traffic from the ALB only.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp:
            Ref: HttpsEgressCidr
          Description: HTTPS egress to AWS endpoints via NAT/PrivateLink.
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp:
            Ref: HttpsEgressCidr
          Description: Egress to Aurora DSQL (PostgreSQL wire protocol, port 5432).

  # Allow the ALB to reach the task on the app port.
  AlbToServiceEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Fn::GetAtt: [AlbSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort:
        Ref: AppPort
      ToPort:
        Ref: AppPort
      DestinationSecurityGroupId:
        Fn::GetAtt: [ServiceSecurityGroup, GroupId]
      Description: ALB to Fargate task on the app port.

  # HTTPS egress for the ALB itself, required ONLY by authenticate-cognito: to
  # complete the OIDC code exchange the ALB calls the Cognito hosted-UI domain
  # (/oauth2/token, /oauth2/userInfo) from its own ENIs. Declaring a
  # SecurityGroupEgress on the ALB SG replaces the default allow-all egress, so
  # without this rule the ALB could reach the task on the app port and NOTHING
  # else -- the login flow got as far as the callback and then failed the token
  # exchange with a bare "500 Internal Server Error" on /oauth2/idpresponse, with
  # no app log at all (the request never reaches the app). Only created when
  # Cognito is enabled: a no-auth ALB needs no outbound internet.
  AlbHttpsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: CognitoEnabled
    Properties:
      GroupId:
        Fn::GetAtt: [AlbSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp:
        Ref: HttpsEgressCidr
      Description: ALB to the Cognito hosted UI for the OIDC token exchange.

  SourceDbEgressBySg:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: UseSourceDbSecurityGroup
    Properties:
      GroupId:
        Fn::GetAtt: [ServiceSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort:
        Ref: SourceDbPort
      ToPort:
        Ref: SourceDbPort
      DestinationSecurityGroupId:
        Ref: SourceDbSecurityGroupId
      Description: Egress to source RDS/Aurora MySQL security group.

  SourceDbEgressByCidr:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: UseSourceDbCidr
    Properties:
      GroupId:
        Fn::GetAtt: [ServiceSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort:
        Ref: SourceDbPort
      ToPort:
        Ref: SourceDbPort
      CidrIp:
        Ref: SourceDbCidr
      Description: Egress to source RDS/Aurora MySQL CIDR.

  # --- Cognito (optional auth gate) ------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Condition: CognitoEnabled
    Properties:
      UserPoolName:
        Fn::Sub: ${AWS::StackName}-users
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: CognitoEnabled
    Properties:
      UserPoolId:
        Ref: UserPool
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      # Callback host = AppDomainName when provided, else the ALB's own DNS name
      # (no custom domain required -- the customer can use the raw ALB URL).
      CallbackURLs:
        - Fn::If:
            - HasAppDomainName
            - Fn::Sub: https://${AppDomainName}/oauth2/idpresponse
            - Fn::Sub:
                - https://${Dns}/oauth2/idpresponse
                - Dns:
                    Fn::GetAtt: [LoadBalancer, DNSName]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: CognitoEnabled
    Properties:
      Domain:
        Ref: CognitoDomainPrefix
      UserPoolId:
        Ref: UserPool

  # The FIRST login user, created by the stack. The pool sets
  # AllowAdminCreateUserOnly, so nobody can sign themselves up -- and without this
  # resource the deploy handed back a working URL that redirected to a login screen
  # with no account to use. Creating it here keeps the whole thing ONE deploy: no
  # follow-up admin-create-user, and no need to hunt for the pool id first.
  #
  # DesiredDeliveryMediums=EMAIL makes Cognito send the temporary password; the hosted
  # UI then forces a new one on first sign-in (the user starts in
  # FORCE_CHANGE_PASSWORD). email_verified is set so that flow is not additionally
  # gated on verifying the address.
  InitialUser:
    Type: AWS::Cognito::UserPoolUser
    Condition: CognitoEnabled
    Properties:
      UserPoolId:
        Ref: UserPool
      Username:
        Ref: CognitoAdminEmail
      DesiredDeliveryMediums:
        - EMAIL
      UserAttributes:
        - Name: email
          Value:
            Ref: CognitoAdminEmail
        - Name: email_verified
          Value: "true"

  # --- Load balancer ----------------------------------------------------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      # Name the ALB explicitly, in lower case. Left unnamed, CloudFormation
      # auto-generates a MIXED-CASE name (e.g. "mysql--LoadB-u9DQdeKlckt9") and the
      # ALB's DNSName inherits that casing verbatim -- but the ALB itself sends the
      # Cognito redirect_uri with the host LOWER-CASED. The Cognito app client's
      # CallbackURLs are built from GetAtt DNSName (mixed case), so the two strings
      # differ and the hosted UI rejects the sign-in with the misleading message
      # "Client is not enabled for OAuth2.0 flows." (verified: A/B/A/B crossover on a
      # live pool -- only the run with a lower-case CallbackURL returned an auth code;
      # /oauth2/authorize tolerates the mismatch, so the login PAGE renders and only
      # the submit fails). Since DNSName casing follows the ALB name, a lower-case name
      # makes DNSName lower case and the two match. The 32-char ELBv2 name cap this puts
      # on the stack name (lower case, <=28 chars) is documented in deploy/DEPLOYMENT.md
      # and guarded by tests/test_deployment_artifacts.py -- it cannot be a template
      # Rule, since Rules cannot reference ${AWS::StackName} or measure string length.
      Name:
        Fn::Sub: ${AWS::StackName}-alb
      Type: application
      Scheme:
        Ref: AlbScheme
      Subnets:
        Ref: AlbSubnetIds
      SecurityGroups:
        - Fn::GetAtt: [AlbSecurityGroup, GroupId]
      # Access logging is off, deliberately (CKV_AWS_91) -- and NOT for the reason first
      # recorded here. The earlier claim was that a log bucket makes delete-stack fail
      # until someone empties it by hand; that is false, because DeletionPolicy: Retain
      # lets the stack delete with the bucket still full (this repo already relies on
      # exactly that for StateVolume in cloudformation-ec2.yaml). Enabling it is
      # feasible and costs about $0.09/month. It is declined on VALUE, not difficulty:
      # AlbScheme defaults to internal, AlbSecurityGroup admits only the operator's own
      # CIDR, and one operator uses this workbench for the length of one migration, so
      # the log would record a single address for a few weeks -- while leaving either a
      # retained bucket after teardown or a second teardown flag to remember. It is
      # also not a one-way door: access logging is a MUTABLE load-balancer attribute, so
      # an operator whose environment requires it turns it on post-deploy with no
      # template change.
      LoadBalancerAttributes:
        # The UI is a persistent NiceGUI WebSocket. The ALB idle timeout defaults
        # to 60s and silently drops the socket on any lull longer than that, which
        # happens during the multi-minute CDC/MSK deploy and large Full Loads --
        # the workbench then goes stale. Raise it to the ALB max so a long-lived
        # control-plane session stays connected; NiceGUI's own pings keep it warm.
        - Key: idle_timeout.timeout_seconds
          Value: "4000"
        # By default an ALB PASSES malformed HTTP headers through to the target,
        # which is the HTTP desync / request-smuggling vector: the ALB and the app
        # can disagree about where one request ends. Dropping them at the edge costs
        # nothing here (the workbench sends only ordinary browser + WebSocket
        # headers) and is what a content-security review expects (CKV_AWS_131,
        # "Ensure that ALB drops HTTP headers" -- an earlier version of this comment
        # cited CKV_AWS_103, which is the listener's TLS-version check satisfied by
        # SslPolicy further down, not this attribute).
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      # Named for the same reason the ALB is named, plus one more: it is what makes an
      # ALB replacement UPGRADEABLE. The ALB's Name is create-only, so setting it
      # replaces the ALB, and CloudFormation replacement is create-new -> repoint
      # references -> delete-old in a later cleanup phase (that order is not
      # configurable; DependsOn only sequences within a phase). An UNNAMED target group
      # has no changed property, so CFN REUSES the same physical target group and points
      # the NEW listener at it while the OLD ALB still holds it -- and an ELBv2 target
      # group may be associated with only one load balancer at a time:
      #   "The following target groups cannot be associated with more than one load
      #    balancer"  (HandlerErrorCode: ServiceLimitExceeded)
      # That is exactly what rolled back the first 0.1.229 upgrade of an existing stack:
      # HttpsListener CREATE_FAILED, with TargetGroup absent from the change set.
      # TargetGroup Name is create-only too, so naming it makes the target group replace
      # in the SAME update -- the new listener forwards to a brand-new group no load
      # balancer holds, and the old ALB/listener/group are torn down together.
      #
      # KEEP THIS COUPLED TO THE ALB Name. Dropping either one silently restores the
      # broken upgrade path, so a test asserts the two are named together.
      #
      # Budget: ELBv2 caps both names at 32 chars and "-tg" is shorter than "-alb", so
      # the documented <=28-char stack-name limit already covers it. Trade-off accepted
      # (the same one the named ALB accepts): with a fixed name, later changing a
      # create-only property -- Port/AppPort, VpcId, TargetType, ProtocolVersion,
      # IpAddressType -- fails with DuplicateTargetGroupName instead of replacing.
      Name:
        Fn::Sub: ${AWS::StackName}-tg
      VpcId:
        Ref: VpcId
      Port:
        Ref: AppPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      # Reach first-healthy quickly and well inside HealthCheckGracePeriodSeconds
      # (300s) so a cold start (image pull + import + startup reconcile) is never
      # mistaken for an unhealthy task and cycled. 2 passes x 15s ~= 30s to healthy.
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: 200-399
      TargetGroupAttributes:
        # NiceGUI uses sticky WebSocket sessions; single task, but enable stickiness.
        - Key: stickiness.enabled
          Value: "true"
        - Key: stickiness.type
          Value: lb_cookie

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: LoadBalancer
      Port: 443
      Protocol: HTTPS
      # An HTTPS listener with no SslPolicy inherits ELBSecurityPolicy-2016-08,
      # which still negotiates TLS 1.0/1.1. Pin the TLS 1.3 policy (it keeps 1.2 as
      # the fallback, so ordinary browsers still connect) -- required by
      # ELBV2_LISTENER_SSL_POLICY_RULE.
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn:
            Ref: CertificateArn
      DefaultActions:
        Fn::If:
          - CognitoEnabled
          - - Type: authenticate-cognito
              Order: 1
              AuthenticateCognitoConfig:
                UserPoolArn:
                  Fn::GetAtt: [UserPool, Arn]
                UserPoolClientId:
                  Ref: UserPoolClient
                UserPoolDomain:
                  Ref: CognitoDomainPrefix
            - Type: forward
              Order: 2
              TargetGroupArn:
                Ref: TargetGroup
          - - Type: forward
              TargetGroupArn:
                Ref: TargetGroup

  # --- ECS service ------------------------------------------------------------
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family:
        Fn::Sub: ${AWS::StackName}-app
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu:
        Ref: ContainerCpu
      Memory:
        Ref: ContainerMemory
      ExecutionRoleArn:
        Fn::GetAtt: [ExecutionRole, Arn]
      TaskRoleArn:
        Fn::GetAtt: [TaskRole, Arn]
      ContainerDefinitions:
        - Name: app
          Image:
            Ref: ContainerImageUri
          Essential: true
          PortMappings:
            - ContainerPort:
                Ref: AppPort
              Protocol: tcp
          Environment:
            - Name: DSQL_MIGRATOR_APP_HOST
              Value: 0.0.0.0
            - Name: DSQL_MIGRATOR_APP_PORT
              Value:
                Fn::Sub: "${AppPort}"
            - Name: DSQL_MIGRATOR_AWS_REGION
              Value:
                Ref: AWS::Region
            # The app assumes this dedicated role for cdc-stack CFN operations,
            # keeping those privileges off the task role.
            - Name: DSQL_MIGRATOR_CDC_DEPLOY_ROLE_ARN
              Value:
                Fn::GetAtt: [CdcDeployRole, Arn]
            - Name: DSQL_MIGRATOR_LOG_LEVEL
              Value: INFO
            # Local SQLite path is the fallback when no JOB bucket is set; on
            # Fargate the DURABLE S3 job store below takes precedence.
            - Name: DSQL_MIGRATOR_JOB_STATE_PATH
              Value: /tmp/job_state.sqlite
            # DURABLE job/resume state: point the JobStore at the tool's managed
            # plugin bucket (same bucket as the session store, jobs/ prefix) so a
            # Full Load job snapshot -- and the per-table migration monitor that
            # reads it -- survives a Fargate task replacement (a redeploy) instead of
            # being lost with the task's EPHEMERAL /tmp SQLite. Writes are coalesced
            # to status transitions (S3JobStore), so this is scan/PUT-safe even for a
            # billion-row load. The snapshot is non-secret (Property 7).
            - Name: DSQL_MIGRATOR_JOB_STATE_BUCKET
              Value:
                Fn::Sub: mysql-dsql-migrator-plugins-${AWS::AccountId}-${AWS::Region}
            # Local SQLite path is the fallback when no session bucket is set; on
            # Fargate the DURABLE S3 store below takes precedence.
            - Name: DSQL_MIGRATOR_SESSION_STATE_PATH
              Value: /tmp/session_state.sqlite
            # DURABLE per-session resume: point the SessionStateStore at the tool's
            # managed plugin bucket (deterministic name, auto-provisioned -- no extra
            # customer setup) so a session's non-secret snapshot survives a Fargate
            # task replacement (a redeploy) instead of being lost with /tmp. A
            # reconnecting browser then resumes its workbench (Evaluation result,
            # schema choices, CDC start point) rather than re-running Step 1. The
            # snapshot is non-secret (Property 7); the stable StorageSecret below
            # keeps the browser id (the snapshot key) constant across restarts so
            # the persisted snapshot is found.
            - Name: DSQL_MIGRATOR_SESSION_STATE_BUCKET
              Value:
                Fn::Sub: mysql-dsql-migrator-plugins-${AWS::AccountId}-${AWS::Region}
            - Name: DSQL_MIGRATOR_ACTIVITY_LOG_PATH
              Value: /tmp/migration_activity.log
            # Mirror the activity log to stdout (-> awslogs -> this CloudWatch log
            # group) when enabled, so the audit trail is durable across task
            # replacement (the /tmp rotating file is ephemeral). Off by default.
            - Name: DSQL_MIGRATOR_ACTIVITY_LOG_STDOUT
              Value:
                Ref: EnableActivityLogCloudWatch
            - Name: BEDROCK_MODEL_ID
              Value:
                Ref: BedrockModelId
            - Name: BEDROCK_REGION
              Value:
                Ref: BedrockRegion
          Secrets:
            # Stable cookie-signing secret for the UI's browser session id, so a
            # reconnecting browser resumes its persisted workbench state (workflow
            # progress, Evaluation result, Full Load linkage) across task restarts
            # instead of re-running Step 1. Auto-generated and held in Secrets
            # Manager (never plaintext in this task definition); injected by the
            # execution role at container start.
            - Name: DSQL_MIGRATOR_STORAGE_SECRET
              ValueFrom:
                Ref: StorageSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: LogGroup
              awslogs-region:
                Ref: AWS::Region
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpsListener
      - AlbToServiceEgress
    Properties:
      Cluster:
        Ref: Cluster
      LaunchType: FARGATE
      # Single-tenant control plane: exactly one task by design -- the app is not
      # built for concurrent writers (CDC-deploy coordination and the in-memory
      # orchestration assume a single instance), so DO NOT raise DesiredCount above 1.
      # State is NOT the reason for the cap: the JobStore/SessionStateStore point at
      # the durable S3 stores above (jobs/ + sessions/ prefixes), not the task's
      # ephemeral /tmp, so job/session snapshots already survive a task swap.
      DesiredCount: 1
      DeploymentConfiguration:
        # MinimumHealthyPercent: 0 lets the single task be replaced on deploy
        # (brief downtime). The cdc-stack (MSK/connectors) and the migrated DSQL
        # data are independent of this task, so a replacement never touches them; and
        # because the job/session snapshots persist in the durable S3 stores above, the
        # replacement RESUMES -- the Full Load continues from its last checkpoint
        # (unfinished PK ranges re-run, idempotent) and a reconnecting browser restores
        # its workbench rather than re-running Evaluation.
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      TaskDefinition:
        Ref: TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp:
            Ref: AssignPublicIp
          Subnets:
            Ref: ServiceSubnetIds
          SecurityGroups:
            - Fn::GetAtt: [ServiceSecurityGroup, GroupId]
      LoadBalancers:
        - ContainerName: app
          ContainerPort:
            Ref: AppPort
          TargetGroupArn:
            Ref: TargetGroup
      # Cover image pull + Python import + startup reconcile (job/session store
      # prune) on a cold task before health checks can cycle it. With the target
      # group's 15s x 2 checks, first-healthy is ~30s -- well inside this window.
      HealthCheckGracePeriodSeconds: 300

Outputs:
  AppUrl:
    Description: >
      URL to reach the app. With no AppDomainName this ALB URL is also the
      Cognito callback host, so you can use it directly (browse here, sign in).
      If you set AppDomainName, browse that instead.
    Value:
      Fn::Sub: https://${LoadBalancer.DNSName}

  LoadBalancerDns:
    Description: ALB DNS name (create a Route 53 record for AppDomainName to this).
    Value:
      Fn::GetAtt: [LoadBalancer, DNSName]

  ClusterName:
    Description: ECS cluster name.
    Value:
      Ref: Cluster

  ServiceName:
    Description: ECS service name.
    Value:
      Fn::GetAtt: [Service, Name]

  TaskRoleArn:
    Description: Least-privilege task role assumed by the app.
    Value:
      Fn::GetAtt: [TaskRole, Arn]

  CdcDeployRoleArn:
    Description: >-
      Privileged role the app assumes for cdc-stack CloudFormation operations
      (CFN/MSK/KafkaConnect/Glue/IAM-create). These privileges are intentionally
      not on the task role.
    Value:
      Fn::GetAtt: [CdcDeployRole, Arn]

  CognitoHostedUiDomain:
    Condition: CognitoEnabled
    Description: Cognito hosted-UI domain users are redirected to for sign-in.
    Value:
      Fn::Sub: https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com

  # The pool id was NOT an output, while CognitoHostedUiDomain's description said
  # "create users in this pool" -- so adding a second user meant hunting for the id in
  # the console or via list-user-pools. admin-create-user needs exactly this value.
  CognitoUserPoolId:
    Condition: CognitoEnabled
    Description: >-
      Cognito user pool id. The first user is created by this stack
      (CognitoAdminEmail); add more with: aws cognito-idp admin-create-user
      --user-pool-id <this> --username <email> --user-attributes
      Name=email,Value=<email> Name=email_verified,Value=true
      --desired-delivery-mediums EMAIL
    Value:
      Ref: UserPool

  CognitoFirstUser:
    Condition: CognitoEnabled
    Description: >-
      Email the stack created as the first login user. Cognito emailed it a temporary
      password; the hosted UI asks for a new one on first sign-in.
    Value:
      Ref: CognitoAdminEmail
