AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Optional streaming CDC data plane (cdc-stack) for the MySQL -> Aurora DSQL
  migration tool. Provisions an MSK Serverless
  cluster (IAM auth), a Glue Schema Registry, two MSK Connect custom plugins
  (Debezium MySQL source + our custom DSQL sink), two MSK Connect connectors,
  and a least-privilege connector execution role. Runtime is managed MSK Connect
  (no EKS/compute cluster); scale via MSK partitions, MSK Connect MCU/worker
  count, and connector tasks.max. The app-stack control plane does NOT depend on
  this stack. PREREQUISITES: both plugin artifacts uploaded to S3. NOTE: MSK Serverless does not expose
  its bootstrap broker string via Ref/GetAtt, so it is supplied as the
  MskBootstrapServers parameter (two-pass deploy). See deploy/cdc-stack/README.md.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC the CDC pipeline runs in (must reach the source MySQL and Aurora DSQL privately).

  ConnectorSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >
      Optional: two or more existing private subnets (distinct AZs, NAT/PrivateLink
      egress) for the MSK Serverless cluster and connectors. When LEFT EMPTY, the
      stack creates its own two private subnets + a NAT gateway inside the VPC
      (NatPublicSubnetId + PrivateSubnetCidr{A,B} + PrivateSubnetAz{A,B} are then
      supplied by the tool). When provided, the stack uses these as-is and creates
      no networking.

  # --- Owned private networking (used only when ConnectorSubnetIds is empty) ---
  # The tool computes these from the VPC topology; they are unused (empty) when the
  # customer supplies ConnectorSubnetIds directly.
  NatPublicSubnetId:
    Type: String
    Default: ""
    Description: >
      Existing IGW-routed public subnet to place the owned NAT gateway in. Auto-
      computed from the VPC when ConnectorSubnetIds is empty; leave empty otherwise.

  PrivateSubnetCidrA:
    Type: String
    Default: ""
    Description: Free /24 CIDR for the first owned private subnet (AZ A).

  PrivateSubnetCidrB:
    Type: String
    Default: ""
    Description: Free /24 CIDR for the second owned private subnet (AZ B).

  PrivateSubnetAzA:
    Type: String
    Default: ""
    Description: Availability Zone for PrivateSubnetCidrA (e.g. us-east-1a).

  PrivateSubnetAzB:
    Type: String
    Default: ""
    Description: Availability Zone for PrivateSubnetCidrB (e.g. us-east-1b).

  # --- Plugin artifacts (Task 23.2 output + Debezium) -------------------------
  PluginBucketArn:
    Type: String
    Description: ARN of the S3 bucket holding both connector plugin artifacts.
    AllowedPattern: ^arn:aws[a-zA-Z-]*:s3:::.+$

  DebeziumPluginS3Key:
    Type: String
    Description: S3 object key of the Debezium MySQL source connector plugin zip.

  DebeziumPostgresPluginS3Key:
    Type: String
    Default: ""
    Description: >
      S3 object key of the Debezium PostgreSQL source connector plugin zip
      (pgoutput). Used only when EngineType=postgres; empty for a MySQL source.

  DsqlSinkPluginS3Key:
    Type: String
    Description: >
      S3 object key of the custom DSQL Sink Connector plugin jar/zip (the Task
      23.2 build output, connectors/dsql-sink/target/...).

  LambdaSeederS3Key:
    Type: String
    Default: ""
    Description: >
      S3 object key of the offset-seeder Lambda deployment zip (pure-Python:
      seeder.py + cfnresponse + kafka-python + the MSK IAM SASL signer). When set
      (alongside a watermark and a bootstrap string) the stack deploys an in-VPC
      Lambda custom resource that creates the compacted source offsets topic and
      seeds the Debezium connect-offsets record BEFORE the source connector is
      created, for a gapless Full Load -> CDC handoff. Empty = no seeder (the
      source connector then starts from the current binlog at creation time).

  PluginVersion:
    Type: String
    Default: v1
    Description: >
      A short version token (e.g. v7, v8) appended to the CustomPlugin resource
      names so swapping a plugin artifact (a new S3 key) creates a uniquely-named
      plugin instead of colliding on a fixed name (gotcha #5). Bump this whenever
      DebeziumPluginS3Key / DsqlSinkPluginS3Key changes; AllowedPattern keeps it to
      the CustomPlugin name charset.
    AllowedPattern: "^[A-Za-z0-9._-]{1,32}$"

  # --- Source engine selector -------------------------------------------------
  # Selects which source connector the stack instantiates. Default 'mysql' keeps
  # every existing deploy byte-identical (the PostgreSQL resources are gated off).
  # The tool sets 'postgres' for a PostgreSQL source; exactly one source connector
  # is created either way (they are mutually exclusive by condition and share the
  # same ConnectorName, so all monitoring/alarms stay engine-agnostic).
  EngineType:
    Type: String
    Default: mysql
    AllowedValues: [mysql, postgres]
    Description: Source database engine (mysql | postgres).

  # --- Source (MySQL) ---------------------------------------------------------
  SourceDbHostname:
    Type: String
    Description: Source database hostname (Debezium database.hostname).

  SourceDbPort:
    Type: Number
    Default: 3306
    MinValue: 1
    MaxValue: 65535
    Description: >
      Source database port (Debezium database.port; also connector egress). The
      tool supplies 3306 for MySQL and 5432 for PostgreSQL.

  SourceDbSecurityGroupId:
    Type: String
    Default: ""
    Description: >
      Optional security group id of the source RDS/Aurora MySQL. When set, egress
      on SourceDbPort is allowed to this security group only (preferred over CIDR).

  SnapshotMode:
    Type: String
    Default: schema_only
    AllowedValues: [recovery, schema_only]
    Description: >
      Debezium snapshot.mode. Use 'recovery' only when the offset-seeder Lambda
      has pre-populated the schema-history topic (gapless Full-Load path). Use
      'schema_only' for new connectors, CDC-only flows, or session resets where
      no schema-history topic exists.

  SourceDbServerId:
    Type: Number
    Default: 54321
    Description: >
      Unique Debezium database.server.id for this source (must not collide with
      other replication clients on the source).

  SourceSecretArn:
    Type: String
    Description: >
      Secrets Manager secret ARN with the source DB credentials (keys: username,
      password). Used to scope secretsmanager:GetSecretValue in the connector
      execution role IAM policy only -- NOT used in connector config references
      (the ARN contains colons that break the ${provider:path:key} parser).
    AllowedPattern: ^arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$

  SourceSecretName:
    Type: String
    Description: >
      Secrets Manager secret NAME (no colons) for the source DB credentials.
      Used by the MSK Connect config provider as ${secretsManager:<name>:<key>}.
      The Kafka Connect ${provider:path:key} syntax splits on ':', so the full
      ARN cannot be used here -- supply the name only (e.g. prod/mysql/cdc-user).
      SourceSecretArn is kept separately for the IAM GetSecretValue resource scope.

  # --- Source (PostgreSQL) ----------------------------------------------------
  # Used only when EngineType=postgres. PostgreSQL logical replication has no
  # server.id/GTID/schema-history; instead a publication + a logical replication
  # slot (pgoutput) identify the capture. The publication and slot are pre-created
  # out of band (publication.autocreate.mode=disabled) -- created by the tool at the
  # Full Load consistency point for a gapless handoff (that wiring lands in a later
  # Phase). All default to empty/inert so a MySQL deploy is unaffected.
  PgDatabaseName:
    Type: String
    Default: ""
    Description: >
      Source PostgreSQL database to capture (Debezium database.dbname). PostgreSQL
      captures a single database (unlike MySQL's server-wide capture).
  PgSlotName:
    Type: String
    Default: ""
    Description: >
      Name of the pre-created logical replication slot (Debezium slot.name). The
      slot pins the source WAL from the Full Load LSN until CDC consumes it.
  PgPublicationName:
    Type: String
    Default: ""
    Description: >
      Name of the pre-created publication scoped to the migrated tables
      (Debezium publication.name). Never FOR ALL TABLES (that would break
      UPDATE/DELETE on the source's no-PK tables).
  PgPublicationAutocreateMode:
    Type: String
    Default: disabled
    AllowedValues: [disabled, filtered, all_tables]
    Description: >
      Debezium publication.autocreate.mode. 'disabled' (default) means the tool/DBA
      pre-creates the publication -- the safe choice; 'all_tables' is rejected by
      design elsewhere in the tool.
  PgSnapshotMode:
    Type: String
    Default: never
    AllowedValues: [never, initial, no_data]
    Description: >
      Debezium PostgreSQL snapshot.mode. 'never' for the gapless Full-Load->CDC
      handoff (the slot already holds the start LSN, so no snapshot is taken);
      'initial' for a stand-alone CDC that should snapshot first.
  PgHeartbeatQuery:
    Type: String
    Default: ""
    Description: >
      Optional Debezium heartbeat.action.query. On a low-traffic source a
      PostgreSQL logical slot's confirmed_flush_lsn only advances when the captured
      tables change, so an idle-captured window can pin WAL. A heartbeat query
      (a write to a dedicated heartbeat table) advances it -- but it WRITES to the
      source, so it is empty by default (the source is read-only unless the operator
      opts in with a heartbeat table). Emitted only when non-empty.

  # --- Target (Aurora DSQL) ---------------------------------------------------
  DsqlClusterArn:
    Type: String
    Description: ARN of the target Aurora DSQL cluster (scopes dsql:DbConnect / dsql:DbConnectAdmin).
    AllowedPattern: ^arn:aws[a-zA-Z-]*:dsql:[a-z0-9-]+:[0-9]{12}:cluster/.+$

  DsqlClusterEndpoint:
    Type: String
    Description: >
      Aurora DSQL cluster endpoint hostname for the sink connector
      (dsql.cluster.endpoint). The custom connector authenticates with a generated IAM
      token (no password), so no DSQL credential is stored here.

  DsqlDatabaseName:
    Type: String
    Default: postgres
    Description: Target DSQL database name the sink connector applies changes to.

  DsqlConnectUser:
    Type: String
    Default: admin
    Description: >
      DSQL database role the sink connector connects as. "admin" requires
      dsql:DbConnectAdmin; a non-admin role uses dsql:DbConnect. Both are scoped
      to DsqlClusterArn.

  # --- Kafka / MSK ------------------------------------------------------------
  MskBootstrapServers:
    Type: String
    Default: ""
    Description: >
      MSK Serverless IAM bootstrap broker string (e.g.
      boot-xxxx.c1.kafka-serverless.<region>.amazonaws.com:9098). NOT available
      via Ref/GetAtt for serverless clusters — supply after the cluster exists
      (see the two-pass note in the stack Description). Required for the
      connectors to deploy.

  TableIncludeList:
    Type: CommaDelimitedList
    Description: >
      Fully-qualified tables to capture (db.table), mirrored into Debezium
      table.include.list and the sink topic set. Matches the selection the
      control plane passes to build_source_config / build_sink_config.

  TopicPrefix:
    Type: String
    Default: dsqlcdc
    Description: >
      Debezium topic.prefix (logical server name). Per-table topics are
      <TopicPrefix>.<db>.<table>.

  SinkTopics:
    Type: String
    Description: >
      Comma-separated list of fully-qualified Kafka topic names the sink connector
      subscribes to (<TopicPrefix>.<db>.<table> for each captured table). Passed
      explicitly to avoid the Fn::Sub backslash-escaping trap (topics.regex built
      with Fn::Sub yields a literal-backslash pattern that matches nothing). The
      control plane build_sink_config returns bare table names (db.table); the
      caller must prefix each with <TopicPrefix>. before passing this parameter,
      e.g. ','.join(f'{prefix}.{t}' for t in sink_config.topics).

  DlqTopicName:
    Type: String
    Default: dsql-sink-dlq
    Description: >
      Dead-letter queue topic for poison change events (sink
      errors.deadletterqueue.topic.name). The Kafka topic itself is not a
      CloudFormation resource; it is auto-created by the sink connector at
      runtime (Req 12.4-12.6).

  AlarmNotificationTopicArn:
    Type: String
    Default: ""
    Description: >
      Optional SNS topic ARN notified when a connector task errors out
      (AWS/KafkaConnect ErroredTaskCount > 0). Leave empty (default): the alarms
      are still created and visible in the CloudWatch console/API -- this only
      adds a notification action, so NO manual notification wiring is needed to
      deploy (deployment-convenience first). Supply a topic ARN to be paged.

  SinkBatchMaxRows:
    Type: Number
    Default: 3000
    MaxValue: 3000
    MinValue: 1
    Description: >
      Max rows per DSQL transaction in the sink connector (DSQL constraint —
      <=3,000 rows/transaction). Do not exceed 3000.

  SinkMaxPollRecords:
    Type: Number
    Default: 3000
    MinValue: 1
    Description: >
      consumer.max.poll.records for the sink worker: the max records handed to
      one SinkTask.put() call, which bounds how many the connector can coalesce
      into a single JDBC executeBatch (one DSQL round-trip). The Kafka default
      (500) capped each batched apply well under the 3,000-row transaction limit,
      leaving the latency-bound sink under-batched. Matches SinkBatchMaxRows so a
      full poll fills one transaction. Raising this raises the WALL-CLOCK cost of one
      put(), which must stay under SinkMaxPollIntervalMs — see that parameter. Set in
      the sink worker config (per-CONNECTOR consumer.* ".override." keys are
      unavailable on MSK Connect, but worker-level consumer.* keys are supported).

  SinkMaxPollIntervalMs:
    Type: Number
    Default: 900000
    MinValue: 60000
    Description: >
      consumer.max.poll.interval.ms for the sink worker: how long ONE
      SinkTask.put() may take before Kafka considers the consumer dead, ejects it
      from the group and revokes its partitions. Kafka's default is 300000 (5 min),
      which this sink can exceed and then stall PERMANENTLY: put() is handed up to
      SinkMaxPollRecords (3000) records, and on any permanent SQL error in a chunk
      the connector falls back to applying that chunk ROW BY ROW, one DSQL
      transaction each (~3 round-trips per row, plus up to ~21 s of OCC backoff per
      unit). At 50 ms/round-trip that single put() is ~450 s — past the default — so
      the consumer is ejected, offsets can no longer be committed, and the task keeps
      logging "Commit of offsets timed out" forever WITHOUT failing (errors.tolerance
      is all and that log is a WARN), leaving the connector RUNNING while replication
      is dead. 900000 (15 min) covers that worst case with headroom. Raise it if you
      raise SinkMaxPollRecords; the heartbeat is a background thread, so a slow put()
      does not need session.timeout.ms to be this large.

  SinkSessionTimeoutMs:
    Type: Number
    Default: 60000
    MinValue: 6000
    Description: >
      consumer.session.timeout.ms for the sink worker: how long the group
      coordinator waits for a HEARTBEAT before evicting the member. Heartbeats come
      from a background thread (they are not blocked by a slow put()), so this only
      needs to absorb worker GC / scheduling pauses — not apply time. Raised from
      Kafka's 45000 default for a little more tolerance on a busy worker. Must stay
      within the broker's group.min/max.session.timeout.ms.

  SinkHeartbeatIntervalMs:
    Type: Number
    Default: 20000
    MinValue: 1000
    Description: >
      consumer.heartbeat.interval.ms for the sink worker. Kafka requires this to be
      lower than SinkSessionTimeoutMs (the guidance is at most one third of it):
      20000 against a 60000 session timeout allows three missed heartbeats before
      eviction.

  SinkOffsetFlushTimeoutMs:
    Type: Number
    Default: 120000
    MinValue: 5000
    Description: >
      offset.flush.timeout.ms for the sink worker: how long Connect waits for an
      offset commit to complete before logging "Commit of offsets timed out" and
      abandoning that attempt. Kafka Connect's default is 5000 (5 s), which is far
      too tight here — the commit path calls the task's flush(), and this sink's
      flush() emits its monitor metrics to CloudWatch synchronously (an SDK call
      whose first invocation also resolves credentials/endpoints, over the NAT
      gateway). A commit that times out is only WARNed, so a too-tight budget shows
      up as a repeating log line rather than an error.

  SourceTasksMax:
    Type: Number
    Default: 1
    MinValue: 1
    Description: >
      Debezium source tasks.max. MySQL source is effectively single-task per
      server; keep at 1 unless using a multi-task setup.

  SourceMaxBatchSize:
    Type: Number
    Default: 8192
    MinValue: 1
    Description: >
      Debezium max.batch.size: events drained from the binlog reader per
      streaming iteration (default 2048). Raising it lets each iteration produce
      a larger burst to Kafka, so the source spends less time per row on the
      produce/queue round-trip — the observed source bottleneck (~2,000 rec/s at
      ~12% CPU is queue/produce-bound, not CPU-bound). Bounded by SourceMaxQueueSize.

  SourceMaxQueueSize:
    Type: Number
    Default: 32768
    MinValue: 1
    Description: >
      Debezium max.queue.size: capacity of the in-memory queue between the binlog
      reader and the Kafka producer (default 8192). A deeper queue keeps the reader
      from stalling while a produce batch is in flight. Should be >= 2x
      SourceMaxBatchSize.

  SourceProducerBatchSize:
    Type: Number
    Default: 262144
    MinValue: 0
    Description: >
      producer.override.batch.size (bytes) for the source connector's Kafka
      producer (default 16384 = 16 KiB). Larger produce batches amortize the
      broker round-trip across more records. Paired with SourceProducerLingerMs so
      a batch has time to fill.

  SourceProducerLingerMs:
    Type: Number
    Default: 20
    MinValue: 0
    Description: >
      producer.override.linger.ms for the source producer (default 0 = send
      immediately). A small linger lets the producer accumulate a fuller batch
      before sending, trading a few ms of latency for markedly higher throughput
      on a high-rate stream.

  SourceProducerCompression:
    Type: String
    Default: lz4
    AllowedValues: [none, gzip, snappy, lz4, zstd]
    Description: >
      producer.override.compression.type for the source producer (default none).
      lz4 is cheap and compresses row-change JSON well, cutting the bytes on the
      producer→broker path — the dominant cost when the source is produce-bound.

  SinkTasksMax:
    Type: Number
    Default: 4
    MinValue: 1
    Description: >
      Sink connector tasks.max (write parallelism). Effective concurrency is
      capped by the topic partition count (Req 12.8).

  ConnectorMcuCount:
    Type: Number
    Default: 4
    AllowedValues: [1, 2, 4, 8]
    Description: MSK Connect MCUs (compute units) per worker for the SOURCE connector.

  SinkMcuCount:
    Type: Number
    Default: 4
    AllowedValues: [1, 2, 4, 8]
    Description: >
      MSK Connect MCUs per worker for the SINK connector, separate from the source
      so the two can be sized independently. The sink became CPU-bound once the
      per-row round-trips were removed (plugin v16: it ran at ~80% CPU / ~21,000
      rows/s at 4 MCU), whereas the single-task source has spare CPU — so the sink
      typically wants more compute than the source.

  ConnectorWorkerCount:
    Type: Number
    Default: 1
    MinValue: 1
    Description: MSK Connect provisioned worker count for each connector.

  TopicDefaultPartitions:
    Type: Number
    Default: 4
    MinValue: 1
    Description: >
      Partitions for each auto-created per-table data topic
      (topic.creation.default.partitions). This is the sink's unit of parallelism
      (one sink task per partition) and is IRREVERSIBLE — a topic's partition
      count can only be raised, never lowered, so the tool infers it from the
      captured-table count at create time (compute_cdc_scaling_defaults). Effective
      sink parallelism = this * number of tables, capped where concurrent DSQL
      upserts to one table begin to contend.

  MaxMessageBytes:
    Type: Number
    Default: 4194304
    MinValue: 1048576
    MaxValue: 8388608
    Description: >
      Per-message byte ceiling applied to the Kafka client limits in BOTH worker
      configs (producer.max.request.size on the source; consumer.fetch.max.bytes /
      consumer.max.partition.fetch.bytes on the sink). H13 mitigation: the Kafka
      client default is 1 MiB, so a serialized change event >1 MiB throws
      RecordTooLargeException on the source producer and kills the source task
      (silent data loss / stall) even though MSK Serverless accepts up to 8 MiB.
      Capped at the 8 MiB MSK Serverless broker limit.

  # Size-proportional partitions (skewed-workload fix). TopicDefaultPartitions
  # above sets a UNIFORM per-topic count; when a few "hot" tables carry most of
  # the writes and there are many tables (default collapses to 1 each), a hot
  # topic's single partition serializes it on one sink task. The tool then keeps
  # TopicDefaultPartitions=1 and puts the hot topics into elevated Debezium
  # topic.creation GROUPS (p2 = 2 partitions, p4 = 4) so they stream across
  # several tasks. Each *Include is a comma-separated list of topic-name regexes;
  # empty = that group is omitted (Fn::If -> AWS::NoValue). TopicCreationGroups is
  # the comma-separated list of active group names ("" | "p2" | "p4" | "p2,p4").
  # The group partition counts (2 / 4) are fixed here to match the tool's tiers
  # (see compute_cdc_partition_plan / CDC_PARTITION_TIERS).
  TopicCreationGroups:
    Type: String
    Default: ""
    Description: >
      Comma-separated Debezium topic.creation group names to activate (subset of
      "p2,p4"), or empty for the uniform TopicDefaultPartitions default only.
  TopicGroupInclude2:
    Type: String
    Default: ""
    Description: >
      Comma-separated topic-name regexes auto-created with 2 partitions (the "p2"
      group). Empty = no p2 group.
  TopicGroupInclude4:
    Type: String
    Default: ""
    Description: >
      Comma-separated topic-name regexes auto-created with 4 partitions (the "p4"
      group). Empty = no p4 group.
  SinkTopicPartitions:
    Type: String
    Default: ""
    Description: >
      Explicit per-topic partition map ("topic:count,...") for the seeder Lambda,
      which PRE-CREATES the per-table topics so the source and sink connectors can
      deploy in parallel. Debezium's topic.creation groups (above) only apply to
      topics Debezium itself creates, but the seeder now creates them first, so the
      seeder must reproduce the size-proportional counts here (topic partitions are
      immutable). Empty = the seeder uses the flat TopicDefaultPartitions for every
      topic (uniform plan). The tool derives this from compute_cdc_partition_plan's
      partitions_by_topic.

  ColumnExcludeList:
    Type: String
    Default: ""
    Description: >
      Comma-separated fully-qualified columns (db.table.column) to drop at capture
      via Debezium column.exclude.list. H13 prevention: excludes a value that can
      exceed DSQL's 1 MiB per-value limit (MySQL LONGTEXT/BLOB) before it reaches
      Kafka. Drive the default set from the Evaluation OVERSIZED_LOB rule; never
      list a PK column. Empty = exclude nothing.

  MessageKeyColumns:
    Type: String
    Default: ""
    Description: >-
      Debezium message.key.columns value: composite record-key override for tables
      whose Aurora DSQL target has a composite primary key (a high-cardinality
      leading column prepended to the source PK to spread writes). Syntax:
      "db.table:leading,pk;db2.table2:leading2,pk2" (";" between tables, ":" before
      the column list, "," between columns; the table part is a regex). Debezium
      then keys the change record on those columns so the sink's record-key
      ON CONFLICT / DELETE match the target key -- no sink change needed. A listed
      column must NOT be in ColumnExcludeList (it is read from the row/before-image
      to build the key). Empty = key on the source primary key (default behavior).

  DeploySink:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Whether to create the DSQL sink connector. Set "false" on the pass that
      first deploys the source connector (so it creates the per-table data topic),
      then "true" on a subsequent pass so the sink subscribes to a topic that
      already exists. Avoids the sink-starts-before-topic race that crash-loops the
      sink task.

  SeedMode:
    Type: String
    Default: "Lambda"
    AllowedValues: ["Lambda", "External"]
    Description: >
      Who performs the CDC Kafka prep (pre-create the compacted offset topic + the
      per-table data topics + the DLQ topic, and seed the connect-offsets record)
      that must happen before the connectors are created. "Lambda" (default,
      unchanged behavior) deploys the in-VPC offset-seeder Lambda + the
      CdcStartPrepResource custom resource to do it. "External" omits those
      resources; the deploying app does the prep IN-PROCESS over the MSK IAM
      bootstrap before this stack update creates the connectors. External requires
      the app to run inside this VPC (admitted on 9098, with data-plane
      kafka-cluster IAM) -- intended for the Lambda-free "EC2 + MSK only" host.

  HostSubnetCidr:
    Type: String
    Default: ""
    Description: >
      Subnet CIDR of the Lambda-free "EC2 + MSK only" control-plane host, admitted
      to MSK Serverless on 9098 so the app can do the CDC Kafka prep in-process
      (SeedMode=External). Empty (default) adds NO ingress rule, so every Lambda-mode
      / existing deploy is unchanged. Supplied by CIDR (not an SG id) to keep the
      app-stack and cdc-stack teardown decoupled, mirroring the bastion rule.

  KafkaConnectVersion:
    Type: String
    Default: "3.7.x"
    Description: >
      Kafka Connect version for the MSK Connect connectors. MUST be 3.7.x: the
      spike found that 2.7.1's bundled AWS SDK is incompatible with the modern
      msk-config-providers jar and fails worker start with
      "NoSuchFieldError: AUTH_SCHEME_PROVIDER".

  AwsRegion:
    Type: String
    Default: ""
    Description: >
      Region for IAM token generation (sink) and Glue converters. Defaults to
      the stack region when left empty.

  # --- Full Load -> CDC handoff watermark (drives the offset seeder) ----------
  # The binlog coordinates the Full Load bulk loader captured. Passed to the
  # in-VPC offset-seeder Lambda so the source connector resumes streaming from
  # exactly the snapshot end point (gapless, Property 11). Empty when no Full Load
  # watermark is available -> the seeder is not deployed (SeedOffset condition).
  WatermarkBinlogFile:
    Type: String
    Default: ""
    Description: Full Load watermark binlog file name (e.g. mysql-bin.000042).

  WatermarkBinlogPos:
    Type: String
    Default: ""
    Description: Full Load watermark binlog position (integer, as a string).

  WatermarkGtids:
    Type: String
    Default: ""
    Description: Full Load watermark GTID set (empty when the source has no GTIDs).

  WatermarkTsSec:
    Type: String
    Default: ""
    Description: Full Load watermark snapshot timestamp (unix seconds, as a string).

Conditions:
  UseSourceDbSecurityGroup:
    Fn::Not:
      - Fn::Equals: [Ref: SourceDbSecurityGroupId, ""]

  # No source-DB security group supplied: the connector still needs egress on the
  # MySQL port or Debezium can never reach the source (TCP connect times out). We
  # then open SourceDbPort egress broadly (the route/destination SG still gate the
  # actual reach) so CDC works without the operator having to discover the source
  # SG id -- deployment-convenience first. Tighten by passing SourceDbSecurityGroupId.
  NoSourceDbSecurityGroup:
    Fn::Equals: [Ref: SourceDbSecurityGroupId, ""]

  RegionProvided:
    Fn::Not:
      - Fn::Equals: [Ref: AwsRegion, ""]

  # A composite record-key override is supplied. Debezium REJECTS an empty
  # message.key.columns, so the key is omitted from the source connector config
  # (AWS::NoValue) unless a value is present -- keeping the default source-PK key.
  HasMessageKeyColumns:
    Fn::Not:
      - Fn::Equals: [Ref: MessageKeyColumns, ""]

  # Size-proportional topic.creation groups (skewed-workload fix). Each group is
  # emitted only when the tool supplies a non-empty include list for it, and the
  # topic.creation.groups key is emitted only when at least one group is active
  # (Debezium rejects an empty groups list / an empty group include, same as
  # message.key.columns above).
  HasTopicCreationGroups:
    Fn::Not:
      - Fn::Equals: [Ref: TopicCreationGroups, ""]
  HasTopicGroup2:
    Fn::Not:
      - Fn::Equals: [Ref: TopicGroupInclude2, ""]
  HasTopicGroup4:
    Fn::Not:
      - Fn::Equals: [Ref: TopicGroupInclude4, ""]

  # Connectors are created only once the MSK Serverless bootstrap string is
  # supplied (it is not available via Ref/GetAtt, so it is a two-pass deploy).
  HasBootstrapServers:
    Fn::Not:
      - Fn::Equals: [Ref: MskBootstrapServers, ""]

  # Source engine gates. Exactly one source connector is created per stack. Default
  # EngineType=mysql -> IsMySqlSource true on every existing stack, so DeployMysqlSource
  # collapses to HasBootstrapServers (the source connector's original gate) and the
  # PostgreSQL resources are absent -- the MySQL path is byte-identical.
  IsMySqlSource:
    Fn::Equals: [Ref: EngineType, "mysql"]
  IsPostgresSource:
    Fn::Equals: [Ref: EngineType, "postgres"]
  DeployMysqlSource:
    Fn::And:
      - Condition: HasBootstrapServers
      - Condition: IsMySqlSource
  DeployPostgresSource:
    Fn::And:
      - Condition: HasBootstrapServers
      - Condition: IsPostgresSource
  # Optional PostgreSQL heartbeat.action.query (writes to the source; off by default).
  HasPgHeartbeatQuery:
    Fn::Not:
      - Fn::Equals: [Ref: PgHeartbeatQuery, ""]

  # SeedMode selects who does the CDC Kafka prep. Default "Lambda" -> SeedByLambda
  # true on every existing stack, so all the seeder gates below (which AND with
  # SeedByLambda) collapse to their current value and the default path is unchanged.
  # "External" -> the app did the prep in-process, so the in-VPC seeder resources are
  # omitted and the sink uses its no-CdcStartPrepResource variant.
  SeedByLambda:
    Fn::Equals: [Ref: SeedMode, "Lambda"]
  SeedByExternal:
    Fn::Equals: [Ref: SeedMode, "External"]

  # A Lambda-free EC2 host subnet CIDR was supplied -> add the 9098 ingress that lets
  # that host reach MSK for in-process seeding. Empty default -> no rule (unchanged).
  HasHostSubnetCidr:
    Fn::Not:
      - Fn::Equals: [Ref: HostSubnetCidr, ""]

  # Sink is created only when the bootstrap string is supplied AND DeploySink=true
  # (deploy the source first so it creates the topic, then the sink -- gotcha #11).
  DeploySinkConnector:
    Fn::And:
      - Fn::Not:
          - Fn::Equals: [Ref: MskBootstrapServers, ""]
      - Fn::Equals: [Ref: DeploySink, "true"]

  # The sink connector's ordering edge to the in-VPC prep is a hard DependsOn, which
  # CloudFormation forbids wrapping in Fn::If. So the sink is split into two variants
  # gated by SeedMode: the Lambda variant keeps DependsOn: CdcStartPrepResource; the
  # External variant drops it (the app pre-created the topics in-process before this
  # update). Exactly one is created. Both AND with DeploySinkConnector so the
  # bootstrap+DeploySink gate is unchanged; in the default (Lambda) mode
  # DeploySinkConnectorLambda == DeploySinkConnector, so the original resource is
  # created identically and the External variant is absent.
  DeploySinkConnectorLambda:
    Fn::And:
      - Condition: DeploySinkConnector
      - Condition: SeedByLambda
  DeploySinkConnectorExternal:
    Fn::And:
      - Condition: DeploySinkConnector
      - Condition: SeedByExternal

  # An SNS topic was supplied for connector-errored-task notifications. The alarms
  # are created regardless (visible in CloudWatch); this only gates the notify action.
  HasAlarmTopic:
    Fn::Not:
      - Fn::Equals: [Ref: AlarmNotificationTopicArn, ""]

  # (Formerly SeedOffset gated a separate offset-seed-only resource. Topic
  # pre-creation + offset seeding are now the single CdcStartPrepResource, which runs
  # on every start (HasBootstrapServers) and seeds the offset only when a watermark
  # is present -- so no separate SeedOffset condition is needed.)

  # The seeder Lambda (+ its role) is deployed whenever its code exists, INDEPENDENT
  # of MskBootstrapServers AND of a watermark -- so it PERSISTS across a Stop (which
  # only blanks MskBootstrapServers). This keeps the VPC-attached Lambda's slow ENI
  # reclamation OUT of the Stop path: a Stop then only removes the connectors + the
  # CdcStartPrepResource invoker (all fast), so the stack settles well inside the
  # control plane's Stop timeout instead of hanging ~20-40 min on the Lambda's ENI
  # cleanup. The Lambda is torn down only on a full stack delete (whose timeout
  # already accommodates that). It no longer requires a watermark: the Lambda now
  # ALSO pre-creates the per-table sink topics on every start (not just seeds an
  # offset on a gapless handoff), so it must exist for CDC-only starts too.
  # HasBootstrapServers (the gate on CdcStartPrepResource, which references this
  # function's Arn) implies the code key is supplied at start, so the ServiceToken
  # reference stays valid.
  # Deploy the seeder Lambda whenever CDC is running (MskBootstrapServers set, so
  # CdcStartPrepResource will invoke it) OR its code key is supplied (so it PERSISTS
  # across a Stop, which blanks MskBootstrapServers -- keeping the Lambda's slow ENI
  # reclamation out of the Stop path). The OR is deliberate: HasBootstrapServers
  # implies this condition, so CdcStartPrepResource (gated on HasBootstrapServers)
  # can always reference the function's Arn / role. In practice the deployer always
  # supplies LambdaSeederS3Key, so this is effectively always true.
  # AND IsMySqlSource: the offset seeder seeds a MySQL binlog connect-offset, so a
  # PostgreSQL stack (which resumes from a replication slot, not a seeded offset)
  # must never create it. No-op for MySQL (IsMySqlSource is true by default).
  DeploySeederFunction:
    Fn::And:
      - Condition: IsMySqlSource
      - Fn::Or:
          - Fn::Not:
              - Fn::Equals: [Ref: MskBootstrapServers, ""]
          - Fn::Not:
              - Fn::Equals: [Ref: LambdaSeederS3Key, ""]

  # The in-VPC seeder Lambda (+ its role) and the CdcStartPrepResource that invokes
  # it are created ONLY in SeedMode=Lambda. AND-ing SeedByLambda onto the existing
  # gates keeps the default path identical (SeedByLambda is true by default) and
  # omits all three resources when SeedMode=External (the app did the prep itself).
  DeploySeederFunctionLambda:
    Fn::And:
      - Condition: DeploySeederFunction
      - Condition: SeedByLambda
  DeployStartPrepResource:
    Fn::And:
      - Condition: HasBootstrapServers
      - Condition: SeedByLambda

  # When no ConnectorSubnetIds are supplied, the stack creates its OWN private
  # subnets + NAT gateway + route table inside the VPC (the customer's existing
  # route tables are untouched). When subnets are supplied, the stack uses them
  # and creates no networking. ConnectorSubnetIds is a CommaDelimitedList whose
  # Ref renders the joined string; the default "" makes this comparison true.
  CreateOwnedNetwork:
    Fn::Equals:
      - Fn::Join: ["", Ref: ConnectorSubnetIds]
      - ""

Resources:
  # --- Observability ----------------------------------------------------------
  # No KmsKeyId, deliberately (CKV_AWS_158 / CLOUDWATCH_LOG_GROUP_ENCRYPTED), and this
  # instance has a technical reason on top of the cost one that declines it for the app
  # stack's own log group. MSK Connect does not write here directly: worker logs arrive
  # through the vended-log-delivery path, so the KMS key policy would have to admit that
  # delivery principal as well as the connector's role, and MSK Connect's own logging
  # documentation states no KMS requirement at all -- there is nothing to verify against
  # short of a live deploy. If that grant were wrong, ingestion fails SILENTLY, and this
  # group is load-bearing: the control plane reads it with FilterLogEvents for DLQ depth,
  # quarantined-record counts and the source-schema-drift banner, and those reads fail
  # closed (see the ReadConnectorWorkerLogs comment in cloudformation.yaml). A key
  # shared from the app stack adds a second hazard: the CDC stack is created and deleted
  # repeatedly inside one migration, so deleting the app stack first would schedule the
  # key for deletion and make already-written logs permanently unreadable.
  # On content: connector/task state, Kafka coordinates, a sqlstate and the server's
  # primary error message. An earlier version of this comment claimed a quarantined row's
  # payload "goes to the Kafka DLQ topic, never here" -- that was WRONG until plugin v29:
  # pgjdbc appends the server's DETAIL to getMessage(), and DETAIL is the failing row.
  # DsqlSinkTask.safeCauseMessage now strips it (v0.1.321). What can still appear is a
  # single offending literal for the SQLSTATEs where the server puts it in the primary
  # message; the row itself cannot.
  ConnectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /msk-connect/${AWS::StackName}-cdc
      RetentionInDays: 30

  # --- Kafka backbone (MSK Serverless, IAM auth) ------------------------------
  # NOTE: no Glue Schema Registry -- the pipeline uses the built-in JSON converter
  # (schemas.enable=true), the spike's proven configuration. The Glue Avro converter
  # was dropped (it bloated the plugin by ~59 MiB x2 and pulled a conflicting SDK).
  #
  # TEARDOWN ORDERING: IAM policies must NOT reach the cluster ARN with
  # `Fn::GetAtt: [MskCluster, Arn]`. CloudFormation reads that as a dependency and
  # deletes in reverse, so the cluster waits for every role that names it. The
  # in-VPC OffsetSeederFunction sits at the head of one such chain
  # (OffsetSeederFunction -> OffsetSeederRole -> MskCluster) and its Lambda-managed
  # ENIs take ~15-20 min to be reclaimed -- so a measured teardown spent 18m30s
  # parked on the seeder before the cluster's own delete (93s) even STARTED.
  # Nothing in those policies is needed at teardown: the connectors are already gone
  # and IAM is only evaluated at call time, so an orphaned ARN in a doomed policy is
  # harmless. Roles therefore build the ARN with `Fn::Sub` + a wildcard for the
  # cluster UUID suffix (see MSK_CLUSTER_ARN_PATTERN comments below), which keeps the
  # same authorization but lets the cluster and the seeder tear down in PARALLEL.
  # Creation order is unaffected -- the connectors still `DependsOn: MskCluster`.
  MskCluster:
    Type: AWS::MSK::ServerlessCluster
    Properties:
      ClusterName:
        Fn::Sub: ${AWS::StackName}-msk
      ClientAuthentication:
        Sasl:
          Iam:
            Enabled: true
      VpcConfigs:
        - SubnetIds:
            Fn::If:
              - CreateOwnedNetwork
              - - Ref: ConnectorSubnetA
                - Ref: ConnectorSubnetB
              - Ref: ConnectorSubnetIds
          SecurityGroups:
            - Fn::GetAtt: [ConnectorSecurityGroup, GroupId]

  # --- Networking -------------------------------------------------------------
  ConnectorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MSK Connect connectors and MSK Serverless egress for CDC pipeline
      VpcId:
        Ref: VpcId
      # INLINE 443->S3 egress for the offset-seeder Lambda's CloudFormation response
      # during TEARDOWN. The seeder's cfnresponse PUTs to the S3 bucket
      # cloudformation-custom-resource-response-<region>; on owned networks that
      # routes via the S3 gateway endpoint (ConnectorS3Endpoint) WITHOUT the NAT.
      # This rule MUST be inline on the SG (not a standalone AWS::EC2::
      # SecurityGroupEgress resource): an inline rule is part of the SG and cannot be
      # deleted while the Lambda's ENI still references the SG -- and CloudFormation
      # cannot delete that ENI until the custom resource's Delete has been handled
      # (dependency chain: CdcStartPrepResource -> OffsetSeederFunction -> this SG). A
      # STANDALONE egress resource has no such ordering and is deleted in parallel
      # with the custom-resource Delete (the ConnectorHttpsEgress 0.0.0.0/0 rule was
      # observed gone BEFORE the seeder Delete ran -> cfnresponse PUT timed out ->
      # teardown hung ~1h then DELETE_FAILED).
      #
      # ALWAYS created, on BOTH network modes. It was previously gated on
      # CreateOwnedNetwork, on the assumption that a customer-subnet deploy "reaches S3
      # via their own egress" -- but the customer's NAT route is irrelevant if the SG
      # no longer permits 443, and the SG's own standalone ConnectorHttpsEgress is
      # exactly what CloudFormation deletes in parallel. So the BYO-subnet path kept
      # failing the same way it was fixed for owned networks: observed on
      # mysql-dsql-cdc-stack-0727 (ConnectorSubnetIds supplied ->
      # ConnectorHttpsEgress DELETE_COMPLETE while CdcStartPrepResource was still
      # waiting -> three 5-min urlopen timeouts -> DELETE_FAILED, leaving an ACTIVE
      # MSK Serverless cluster billing).
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          # NO apostrophe (or any char outside EC2's set for rule descriptions:
          # a-zA-Z0-9 and . _-:/()#,@[]+=&;{}!$*). "customer's" here made the whole
          # SG CREATE_FAIL with "Invalid rule description", which rolled the stack
          # back -- and the rollback then hit ROLLBACK_FAILED because the two
          # CustomPlugins were still CREATING and cannot be deleted in that state.
          Description: >-
            HTTPS egress for the offset-seeder CloudFormation response during
            teardown (S3 via the gateway endpoint on an owned network, or via a
            supplied subnet NAT). Inline so it outlives the custom-resource
            Delete (see SG comment above).

  # MSK Serverless and the connectors share this SG; allow intra-SG Kafka traffic.
  ConnectorSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::GetAtt: [ConnectorSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 9098
      ToPort: 9098
      SourceSecurityGroupId:
        Fn::GetAtt: [ConnectorSecurityGroup, GroupId]
      Description: Kafka IAM/TLS traffic within the connector/MSK security group.

  # Diagnostics access: let the in-VPC bastion reach MSK Serverless on 9098 for
  # operational tasks the laptop can't do (MSK bootstrap is VPC-private) -- gapless
  # offset seeding, topic alters (max.message.bytes), consumer-lag / offset checks.
  # Allowed by CIDR (the bastion's subnet 172.31.0.0/20), NOT by SG id, so every
  # FUTURE cdc-stack's fresh ConnectorSecurityGroup grants the same access without
  # re-attaching the bastion to this SG (which previously blocked stack deletion --
  # see the 2026-06-27 run notes). The bastion keeps its own SG; this is inbound on
  # the MSK side only. /20 (not /32) so a bastion IP change still works.
  ConnectorBastionDiagnosticsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::GetAtt: [ConnectorSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 9098
      ToPort: 9098
      CidrIp: 172.31.0.0/20
      Description: Diagnostics - bastion subnet to MSK Serverless (IAM/TLS 9098).

  # Lambda-free ("EC2 + MSK only", SeedMode=External) reachability: admit the in-VPC
  # EC2 control-plane host to MSK on 9098 so the app can do the CDC Kafka prep
  # in-process (create topics + seed the offset) instead of the seeder Lambda. Like
  # the bastion rule above, allowed BY CIDR (the host's subnet), NOT by SG id, so the
  # two stacks' teardown stays decoupled (an SG-id cross-reference previously blocked
  # stack deletion). Condition-gated on a NON-EMPTY HostSubnetCidr with an empty
  # default, so every existing deploy (and every Lambda-mode deploy) templates
  # identically -- the rule simply does not exist unless a host CIDR is supplied.
  ConnectorHostDiagnosticsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasHostSubnetCidr
    Properties:
      GroupId:
        Fn::GetAtt: [ConnectorSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 9098
      ToPort: 9098
      CidrIp:
        Ref: HostSubnetCidr
      Description: Lambda-free EC2 host subnet to MSK Serverless (IAM/TLS 9098).

  ConnectorKafkaEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Fn::GetAtt: [ConnectorSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 9098
      ToPort: 9098
      DestinationSecurityGroupId:
        Fn::GetAtt: [ConnectorSecurityGroup, GroupId]
      Description: Egress to MSK brokers (IAM/TLS) within the security group.

  # NOTE: the 443 HTTPS egress rule (Secrets Manager, Glue, CloudWatch, the DSQL IAM
  # token signer, STS -- and the offset-seeder's CloudFormation response) is INLINE on
  # ConnectorSecurityGroup, not a standalone resource here. A standalone
  # AWS::EC2::SecurityGroupEgress is deleted in parallel with the custom-resource
  # Delete, which is exactly how teardown broke: the rule went away first, the seeder's
  # cfnresponse PUT timed out, and the stack landed in DELETE_FAILED with a billable MSK
  # cluster left behind. An inline rule is part of the SG, which CloudFormation cannot
  # delete while the seeder Lambda's ENI still references it. See that SG's comment.

  ConnectorDsqlEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Fn::GetAtt: [ConnectorSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      CidrIp: 0.0.0.0/0
      Description: >-
        Egress to Aurora DSQL (PostgreSQL wire protocol, 5432) for the sink
        connector. Tighten to the DSQL endpoint CIDR/PrivateLink in prod.

  ConnectorSourceDbEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: UseSourceDbSecurityGroup
    Properties:
      GroupId:
        Fn::GetAtt: [ConnectorSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort:
        Ref: SourceDbPort
      ToPort:
        Ref: SourceDbPort
      DestinationSecurityGroupId:
        Ref: SourceDbSecurityGroupId
      Description: Egress to the source RDS/Aurora MySQL security group (Debezium).

  # Fallback when no source-DB security group is supplied: without ANY egress on
  # the MySQL port the Debezium source task cannot open a TCP connection to the
  # source and fails connection validation with a SocketTimeoutException (the
  # connector then CREATE_FAILs and the stack rolls back). Opening SourceDbPort to
  # 0.0.0.0/0 lets the worker reach the source whether it resolves to a private
  # (same-VPC) or public RDS address; the route table + the source SG inbound rules
  # still gate what is actually reachable. Pass SourceDbSecurityGroupId to replace
  # this with the tighter SG-to-SG rule above.
  ConnectorSourceDbEgressOpen:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: NoSourceDbSecurityGroup
    Properties:
      GroupId:
        Fn::GetAtt: [ConnectorSecurityGroup, GroupId]
      IpProtocol: tcp
      FromPort:
        Ref: SourceDbPort
      ToPort:
        Ref: SourceDbPort
      CidrIp: 0.0.0.0/0
      Description: >-
        Egress to the source MySQL on SourceDbPort (no source SG supplied). Tighten
        by passing SourceDbSecurityGroupId so egress targets that SG only.

  # --- Owned private networking (created only when ConnectorSubnetIds is empty) -
  # The stack creates its own 2 private subnets + a NAT gateway + a private route
  # table inside the customer's VPC, giving the connectors egress to DSQL / Secrets
  # Manager / STS / Glue / CloudWatch WITHOUT touching the customer's existing route
  # tables. All deleted automatically when the stack is deleted. The tool computes
  # NatPublicSubnetId (an existing IGW-routed subnet) + the two free /24 CIDRs/AZs.
  ConnectorEip:
    Type: AWS::EC2::EIP
    Condition: CreateOwnedNetwork
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${AWS::StackName}-nat-eip

  ConnectorNatGateway:
    Type: AWS::EC2::NatGateway
    Condition: CreateOwnedNetwork
    DependsOn: ConnectorEip
    Properties:
      AllocationId:
        Fn::GetAtt: [ConnectorEip, AllocationId]
      SubnetId:
        Ref: NatPublicSubnetId
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${AWS::StackName}-nat

  ConnectorSubnetA:
    Type: AWS::EC2::Subnet
    Condition: CreateOwnedNetwork
    Properties:
      VpcId:
        Ref: VpcId
      CidrBlock:
        Ref: PrivateSubnetCidrA
      AvailabilityZone:
        Ref: PrivateSubnetAzA
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${AWS::StackName}-private-a

  ConnectorSubnetB:
    Type: AWS::EC2::Subnet
    Condition: CreateOwnedNetwork
    Properties:
      VpcId:
        Ref: VpcId
      CidrBlock:
        Ref: PrivateSubnetCidrB
      AvailabilityZone:
        Ref: PrivateSubnetAzB
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${AWS::StackName}-private-b

  ConnectorPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateOwnedNetwork
    Properties:
      VpcId:
        Ref: VpcId
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${AWS::StackName}-private-rt

  ConnectorNatRoute:
    Type: AWS::EC2::Route
    Condition: CreateOwnedNetwork
    DependsOn: ConnectorNatGateway
    Properties:
      RouteTableId:
        Ref: ConnectorPrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId:
        Ref: ConnectorNatGateway

  # S3 Gateway VPC endpoint on the owned private route table. The in-VPC offset
  # seeder Lambda signals CloudFormation by PUTting to a pre-signed *S3* response
  # URL; with only a NAT route, that egress dies the moment the NAT is torn down
  # during stack DELETE, so the custom resource's Delete response never arrives and
  # CloudFormation hangs ~1h then DELETE_FAILS the whole stack. A gateway endpoint
  # routes S3 traffic via the route table (no NAT, no internet), so the cfnresponse
  # PUT succeeds even mid-teardown. Gateway endpoints are free and region-local.
  ConnectorS3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateOwnedNetwork
    Properties:
      VpcId:
        Ref: VpcId
      ServiceName:
        Fn::Sub: com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - Ref: ConnectorPrivateRouteTable

  ConnectorSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateOwnedNetwork
    Properties:
      SubnetId:
        Ref: ConnectorSubnetA
      RouteTableId:
        Ref: ConnectorPrivateRouteTable

  ConnectorSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateOwnedNetwork
    Properties:
      SubnetId:
        Ref: ConnectorSubnetB
      RouteTableId:
        Ref: ConnectorPrivateRouteTable

  # --- Connector execution role (least privilege) -----------------------------
  ConnectorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: kafkaconnect.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: dsql-connect
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The sink connects to DSQL with a generated IAM token. "admin"
              # needs DbConnectAdmin; a non-admin role uses DbConnect. Scoped to
              # this cluster only.
              - Sid: DsqlConnect
                Effect: Allow
                Action:
                  - dsql:DbConnect
                  - dsql:DbConnectAdmin
                Resource:
                  Ref: DsqlClusterArn
        - PolicyName: read-source-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: GetSourceSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Ref: SourceSecretArn
        - PolicyName: msk-cluster-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: MskConnect
                Effect: Allow
                Action:
                  - kafka-cluster:Connect
                  - kafka-cluster:DescribeCluster
                  - kafka-cluster:AlterCluster
                # MSK_CLUSTER_ARN_PATTERN: built by name, NOT Fn::GetAtt, so this
                # role does not become a delete-time dependency of MskCluster (see
                # the MskCluster comment). The trailing `/*` covers the UUID suffix
                # MSK appends (.../<name>/<uuid>-s3); the cluster NAME is already
                # unique per stack, so this grants no broader access.
                Resource:
                  Fn::Sub: >-
                    arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:cluster/${AWS::StackName}-msk/*
              - Sid: MskTopics
                Effect: Allow
                Action:
                  - kafka-cluster:CreateTopic
                  - kafka-cluster:DescribeTopic
                  - kafka-cluster:ReadData
                  - kafka-cluster:WriteData
                  - kafka-cluster:DescribeTopicDynamicConfiguration
                  - kafka-cluster:AlterTopicDynamicConfiguration
                Resource:
                  Fn::Sub: >-
                    arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:topic/${AWS::StackName}-msk/*
              - Sid: MskGroups
                Effect: Allow
                Action:
                  - kafka-cluster:AlterGroup
                  - kafka-cluster:DescribeGroup
                Resource:
                  Fn::Sub: >-
                    arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:group/${AWS::StackName}-msk/*
        - PolicyName: plugin-artifact-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadPluginArtifacts
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: ${PluginBucketArn}/*
        - PolicyName: connector-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteConnectorLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  Fn::GetAtt: [ConnectorLogGroup, Arn]
        - PolicyName: emit-metrics
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The sink emits the per-table NetRowsApplied monitor metric.
              # cloudwatch:PutMetricData has no resource-level scoping (Resource must
              # be "*"); a namespace condition restricts it to the tool's own metrics.
              - Sid: PutCdcMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: MysqlDsqlMigrator/CDC

  # --- Worker configuration: source connector (converters + Secrets Manager provider) ---
  # MSK Connect requires key.converter/value.converter in every WorkerConfiguration
  # (gotcha #1). We use the built-in JSON converter with schemas.enable=true (the
  # spike's proven configuration): the custom sink's DebeziumEvents parser requires
  # a Connect Struct envelope, which schemas.enable=true delivers. JSON converter is
  # part of the MSK Connect runtime -- no extra plugin jar, no Glue Schema Registry,
  # and no heavy shaded SDK (which is what caused the AUTH_SCHEME_PROVIDER conflict).
  # The Secrets Manager config-provider class is bundled in the Debezium plugin zip
  # (msk-config-providers jar); it is NOT on the MSK Connect runtime classpath, so
  # the sink has its own separate worker config without it (gotcha #6, below).
  #
  # Internal-topic partition counts (offset.storage.partitions / status.storage.
  # partitions): MSK Connect creates three COMPACTED internal topics per connector
  # instance -- offsets (default 25), status (default 5), configs (1) = 31
  # compacted partitions each. MSK Serverless caps COMPACTED partitions at 120
  # cluster-wide, and the topic names embed the connector's instance UUID, so each
  # (re)deploy creates a fresh 31-partition set and the old one is NOT reused/
  # deleted -- ~3-4 redeploys exhaust the 120 cap and the next connector fails to
  # create (its offsets topic can't be created -> worker never initializes). These
  # internal topics carry only tiny, low-frequency metadata (an offset commit is a
  # few records/sec regardless of data throughput), so 1 partition is ample; the
  # defaults assume a large multi-connector cluster. Real replication throughput is
  # driven by the per-table DATA topics (topic.creation.default.partitions), which
  # are unaffected. Result: 31 -> 3 compacted partitions per connector (~10x
  # headroom against the 120 cap) with no effect on CDC latency or correctness.
  #
  # offset.storage.topic: the source worker pins a FIXED, predictable offsets topic
  # name (${AWS::StackName}-debezium-source-offsets) instead of letting MSK Connect
  # derive a per-instance UUID-named one. This is what lets the OffsetSeeder Lambda
  # create + seed that exact topic BEFORE the source connector is created, for a
  # gapless Full Load -> CDC handoff. The topic must already exist as a COMPACTED
  # topic (the seeder creates it); the connector does NOT auto-create a custom
  # offset topic. Pinning it changes PropertiesFileContent, so this immutable custom-
  # named resource is renamed via PluginVersion (v6) just like the plugins.
  WorkerConfiguration:
    Type: AWS::KafkaConnect::WorkerConfiguration
    Properties:
      # Name carries PluginVersion: AWS::KafkaConnect::WorkerConfiguration is
      # custom-named and immutable, so changing PropertiesFileContent forces a
      # replacement that would collide on a fixed name ("cannot update a stack when a
      # custom-named resource requires replacing"). Versioning the name lets the
      # worker config be swapped via a normal update_stack, same as the plugins.
      Name:
        Fn::Sub: ${AWS::StackName}-source-worker-config-${PluginVersion}
      Description: JSON converters (schemas.enable=true), Secrets Manager config provider, and H13 producer limit for the Debezium source connector.
      PropertiesFileContent:
        Fn::Base64:
          Fn::Sub: |
            key.converter=org.apache.kafka.connect.json.JsonConverter
            key.converter.schemas.enable=true
            value.converter=org.apache.kafka.connect.json.JsonConverter
            value.converter.schemas.enable=true
            config.providers=secretsManager
            config.providers.secretsManager.class=com.amazonaws.kafka.config.providers.SecretsManagerConfigProvider
            config.providers.secretsManager.param.region=${AWS::Region}
            producer.max.request.size=${MaxMessageBytes}
            producer.batch.size=${SourceProducerBatchSize}
            producer.linger.ms=${SourceProducerLingerMs}
            producer.compression.type=${SourceProducerCompression}
            offset.storage.partitions=1
            status.storage.partitions=1
            offset.storage.topic=${AWS::StackName}-debezium-source-offsets

  # --- Worker configuration: sink connector (converters + fetch limits + timeouts) ---
  # The sink plugin jar does NOT bundle the Secrets Manager config-provider class
  # (com.amazonaws.kafka.config.providers.SecretsManagerConfigProvider), so
  # declaring config.providers here would fail the sink with ClassNotFoundException
  # (gotcha #6). The sink authenticates to DSQL via IAM token -- no secret reference
  # needed. Converters MUST match the source (JSON, schemas.enable=true) so the sink
  # deserializes exactly what the source serialized. Plus the H13 consumer fetch
  # limits and producer send limit (so an oversized record can be fetched and
  # dead-lettered up to the 8 MiB broker limit).
  #
  # CONSUMER TIMEOUTS (max.poll.interval / session / heartbeat + offset.flush.timeout)
  # are set here because this sink's put() is SLOW and unbounded by design: a
  # permanent SQL error in a chunk makes it re-apply that chunk row by row, one DSQL
  # transaction per row, and a transient failure is retried indefinitely (see
  # DsqlSinkTask.applyBatch). On Kafka's defaults (max.poll.interval.ms=300000,
  # offset.flush.timeout.ms=5000) a long put() gets the consumer EJECTED from its
  # group; offsets then can never commit, and because errors.tolerance=all and the
  # resulting "Commit of offsets timed out" is only a WARN, the task never fails --
  # the connector sits at RUNNING with replication permanently dead. These keys ARE
  # supported at worker level (the MSK Connect "Supported worker configuration
  # properties" allowlist names consumer.max.poll.interval.ms,
  # consumer.session.timeout.ms and consumer.heartbeat.interval.ms; offset.flush.
  # timeout.ms carries no producer./consumer. prefix and is not on the exclusion
  # list). What MSK Connect does NOT support is the per-CONNECTOR ".override." form,
  # because it excludes connector.client.config.override.policy -- that is why these
  # live in the worker config and not in the connector config.
  SinkWorkerConfiguration:
    Type: AWS::KafkaConnect::WorkerConfiguration
    Properties:
      # Name carries PluginVersion (immutable custom-named resource; see source
      # WorkerConfiguration above) so an update can replace it without a name clash.
      Name:
        Fn::Sub: ${AWS::StackName}-sink-worker-config-${PluginVersion}
      Description: JSON converters (schemas.enable=true), H13 consumer/producer fetch limits, and the consumer poll/session timeouts a slow DSQL apply needs. No Secrets Manager provider (not bundled in the sink jar).
      PropertiesFileContent:
        Fn::Base64:
          Fn::Sub: |
            key.converter=org.apache.kafka.connect.json.JsonConverter
            key.converter.schemas.enable=true
            value.converter=org.apache.kafka.connect.json.JsonConverter
            value.converter.schemas.enable=true
            consumer.max.partition.fetch.bytes=${MaxMessageBytes}
            consumer.fetch.max.bytes=${MaxMessageBytes}
            consumer.max.poll.records=${SinkMaxPollRecords}
            consumer.max.poll.interval.ms=${SinkMaxPollIntervalMs}
            consumer.session.timeout.ms=${SinkSessionTimeoutMs}
            consumer.heartbeat.interval.ms=${SinkHeartbeatIntervalMs}
            offset.flush.timeout.ms=${SinkOffsetFlushTimeoutMs}
            producer.max.request.size=${MaxMessageBytes}
            offset.storage.partitions=1
            status.storage.partitions=1

  # --- Custom plugins ---------------------------------------------------------
  DebeziumSourcePlugin:
    Type: AWS::KafkaConnect::CustomPlugin
    Properties:
      # Name carries PluginVersion so a new artifact (key change + version bump)
      # creates a uniquely-named plugin instead of colliding on a fixed name.
      Name:
        Fn::Sub: ${AWS::StackName}-debezium-mysql-${PluginVersion}
      ContentType: ZIP
      Location:
        S3Location:
          BucketArn:
            Ref: PluginBucketArn
          FileKey:
            Ref: DebeziumPluginS3Key

  # Debezium PostgreSQL source plugin (pgoutput). Created only for a PostgreSQL
  # source; a distinct resource name from the MySQL plugin (both carry PluginVersion
  # for immutable-name safety). Only one source plugin exists per stack.
  PostgresSourcePlugin:
    Type: AWS::KafkaConnect::CustomPlugin
    Condition: IsPostgresSource
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-debezium-postgres-${PluginVersion}
      ContentType: ZIP
      Location:
        S3Location:
          BucketArn:
            Ref: PluginBucketArn
          FileKey:
            Ref: DebeziumPostgresPluginS3Key

  DsqlSinkPlugin:
    Type: AWS::KafkaConnect::CustomPlugin
    Properties:
      # Name carries PluginVersion (gotcha #5 fix): AWS::KafkaConnect::CustomPlugin
      # has a required, immutable Name, so changing the S3 key alone forces a
      # replacement that collides on a fixed name ("cannot update a stack when a
      # custom-named resource requires replacing"). Bumping PluginVersion alongside
      # the key gives the replacement a new name, so the artifact can be swapped via
      # a normal update_stack (no delete + recreate). Safe because the connectors
      # reference the plugin by GetAtt ARN, which updates with the replacement.
      Name:
        Fn::Sub: ${AWS::StackName}-dsql-sink-${PluginVersion}
      # ZIP bundle holding ONLY the sink jar (JSON converter is built into the MSK
      # runtime, so no Glue converter jar is bundled -- that removed ~59 MiB and the
      # SDK-conflict surface). A single-jar zip is a valid MSK Connect plugin format.
      ContentType: ZIP
      Location:
        S3Location:
          BucketArn:
            Ref: PluginBucketArn
          FileKey:
            Ref: DsqlSinkPluginS3Key

  # --- Offset seeder Lambda (gapless Full Load -> CDC handoff) -----------------
  # An in-VPC CloudFormation custom-resource Lambda that, BEFORE the source
  # connector is created, (1) creates the fixed compacted offsets topic the source
  # worker config points at and (2) seeds the Debezium connect-offsets record from
  # the Full Load watermark so the connector resumes streaming with no gap
  # (Property 11). The Role + Function persist across a Stop (DeploySeederFunction,
  # independent of MskBootstrapServers) so the VPC-Lambda ENI teardown is kept OFF
  # the Stop path; only the CdcStartPrepResource invoker below is gated on SeedOffset.
  # When neither applies the source connector simply starts from the current binlog.
  OffsetSeederRole:
    Type: AWS::IAM::Role
    Condition: DeploySeederFunctionLambda
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # In-VPC Lambda needs ENI management; AWSLambdaVPCAccessExecutionRole grants
      # exactly that (create/describe/delete network interfaces) plus basic logs.
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: msk-seed-offsets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Connect to the cluster + create/describe/read/write ONLY the fixed
              # source offsets topic (scoped to its exact name, not topic/*).
              - Sid: MskConnect
                Effect: Allow
                Action:
                  - kafka-cluster:Connect
                  - kafka-cluster:DescribeCluster
                  # kafka-python enables the idempotent producer under acks=all,
                  # which sends InitProducerId -- MSK rejects that with
                  # ClusterAuthorizationFailedError unless this CLUSTER-level grant
                  # is present. The seeder now disables idempotence (so this isn't
                  # strictly required), but grant it too so a future idempotent /
                  # transactional seed path can't silently fail the gapless handoff
                  # again. This action is cluster-scoped (not topic-scoped).
                  - kafka-cluster:WriteDataIdempotently
                # MSK_CLUSTER_ARN_PATTERN: built by name, NOT Fn::GetAtt. This is the
                # site that actually caused the slow teardown -- via Fn::GetAtt the
                # chain OffsetSeederFunction -> OffsetSeederRole -> MskCluster made
                # the cluster wait ~18 min for the seeder's Lambda ENIs. See the
                # MskCluster comment.
                Resource:
                  Fn::Sub: >-
                    arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:cluster/${AWS::StackName}-msk/*
              - Sid: MskSeedTopic
                Effect: Allow
                Action:
                  - kafka-cluster:CreateTopic
                  - kafka-cluster:DescribeTopic
                  - kafka-cluster:ReadData
                  - kafka-cluster:WriteData
                  - kafka-cluster:DescribeTopicDynamicConfiguration
                  - kafka-cluster:AlterTopicDynamicConfiguration
                # Three topic scopes: (1) the fixed compacted offsets topic (seeded on
                # a gapless handoff); (2) the per-table data topics the seeder now
                # PRE-CREATES so both connectors deploy in parallel -- scoped to this
                # capture's Debezium topic.prefix (<TopicPrefix>.<db>.<table>); (3) the
                # sink DLQ topic, which the seeder also PRE-CREATES at MaxMessageBytes
                # (its name is DlqTopicName, NOT under TopicPrefix). Without (2)/(3)
                # CreateTopic on those is denied and every start fails.
                Resource:
                  - Fn::Sub: >-
                      arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:topic/${AWS::StackName}-msk/*/${AWS::StackName}-debezium-source-offsets
                  - Fn::Sub: >-
                      arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:topic/${AWS::StackName}-msk/*/${TopicPrefix}.*
                  - Fn::Sub: >-
                      arn:${AWS::Partition}:kafka:${AWS::Region}:${AWS::AccountId}:topic/${AWS::StackName}-msk/*/${DlqTopicName}

  OffsetSeederFunction:
    Type: AWS::Lambda::Function
    Condition: DeploySeederFunctionLambda
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-offset-seeder
      Description: Seeds the Debezium source connect-offsets topic for a gapless Full Load -> CDC handoff.
      Runtime: python3.12
      Handler: seeder.handler
      Role:
        Fn::GetAtt: [OffsetSeederRole, Arn]
      # Producing/consuming over MSK IAM SASL + creating a compacted topic can take
      # tens of seconds on a cold start; 300s is comfortably under the CFN custom-
      # resource 1h ceiling while bounding a wedged Kafka call.
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket:
          # Reuse the managed plugin bucket (PluginBucketArn is arn:aws:s3:::<name>);
          # strip the ARN prefix to the bare bucket name Lambda Code expects.
          Fn::Select: [5, Fn::Split: [":", Ref: PluginBucketArn]]
        S3Key:
          Ref: LambdaSeederS3Key
      VpcConfig:
        # Same SG + subnets as the connectors -- already allow 9098 to MSK and 443
        # egress (for the IAM SASL token signer's STS/region calls).
        SecurityGroupIds:
          - Fn::GetAtt: [ConnectorSecurityGroup, GroupId]
        SubnetIds:
          Fn::If:
            - CreateOwnedNetwork
            - - Ref: ConnectorSubnetA
              - Ref: ConnectorSubnetB
            - Ref: ConnectorSubnetIds
      Environment:
        Variables:
          MSK_BOOTSTRAP:
            Ref: MskBootstrapServers
          OFFSETS_TOPIC:
            Fn::Sub: ${AWS::StackName}-debezium-source-offsets
          CONNECTOR_NAME:
            Fn::Sub: ${AWS::StackName}-debezium-source
          TOPIC_PREFIX:
            Ref: TopicPrefix
          # Match the source worker's offset.storage.partitions so the seeded
          # compacted topic has the same partitioning the connector expects.
          OFFSET_PARTITIONS: "1"
          TARGET_REGION:
            Fn::If: [RegionProvided, Ref: AwsRegion, Ref: "AWS::Region"]
          # Teardown-ordering for the ROUTING half of the S3 egress path (owned-
          # network only). The PRIMARY fix is the inline 443->S3-prefix-list egress
          # rule on ConnectorSecurityGroup (a standalone SecurityGroupEgress resource
          # races the custom-resource Delete and loses -- see that SG's comment). This
          # env var complements it by keeping the ROUTE alive: the seeder's
          # cfnresponse PUTs to S3, which the gateway endpoint routes WITHOUT the NAT,
          # but only while the endpoint + the seeder subnet's route-table association
          # still exist. Referencing them here forces the chain
          #   CdcStartPrepResource --(ServiceToken)--> this function --(these Refs)-->
          #   {S3 endpoint, BOTH subnet route-table associations}
          # so the whole routing path is torn down strictly AFTER the custom-resource
          # Delete responds. (Route table is pinned transitively: endpoint & the
          # associations both DependsOn it.) Unused by the handler; ordering only.
          S3_EGRESS_ORDERING:
            Fn::If:
              - CreateOwnedNetwork
              - Fn::Join:
                  - ","
                  - - Ref: ConnectorS3Endpoint
                    - Ref: ConnectorSubnetARouteTableAssociation
                    - Ref: ConnectorSubnetBRouteTableAssociation
              - "none"

  # The custom resource that invokes the seeder Lambda on every CDC start. It runs
  # whenever the bootstrap string is known (HasBootstrapServers) -- NOT only when a
  # watermark exists -- because it now has TWO jobs:
  #  (1) ALWAYS pre-create the per-table sink topics (SinkTopics) with the sink's
  #      partition count, so the source and sink connectors can be created in one
  #      PARALLEL pass (both DependsOn this resource) instead of source-then-sink.
  #  (2) Seed the connect-offsets record ONLY when a watermark is present (gapless
  #      Full-Load handoff).
  # All properties are resource properties, so a change to ANY of them re-invokes
  # the Lambda on the next stack update (idempotent: existing topics are skipped, an
  # advanced offset is no-clobbered). Both connectors DependsOn this so the topics
  # (and, when present, the seed) land before either connector is created.
  CdcStartPrepResource:
    Type: AWS::CloudFormation::CustomResource
    Condition: DeployStartPrepResource
    DependsOn:
      - MskCluster
      - OffsetSeederRole
    Properties:
      ServiceToken:
        Fn::GetAtt: [OffsetSeederFunction, Arn]
      SinkTopics:
        Ref: SinkTopics
      # Flat fallback partition count; SinkTopicPartitions (below) overrides it
      # per-topic so the seeder reproduces the size-proportional plan.
      TopicPartitions:
        Ref: TopicDefaultPartitions
      SinkTopicPartitions:
        Ref: SinkTopicPartitions
      # So the pre-created data topics get the same max.message.bytes the source
      # worker's producer uses -- otherwise a >1 MiB change event RecordTooLarges.
      MaxMessageBytes:
        Ref: MaxMessageBytes
      # Pre-create the sink DLQ topic at the same max.message.bytes: a record the
      # sink dead-letters on DSQL's 1 MiB per-value limit is itself >1 MiB, so a DLQ
      # topic left at the broker's ~1 MiB default rejects the quarantine
      # (RecordTooLargeException) and kills the sink task. Without this the DLQ topic
      # is lazily auto-created by Kafka Connect at the 1 MiB default.
      DlqTopicName:
        Ref: DlqTopicName
      WatermarkBinlogFile:
        Ref: WatermarkBinlogFile
      WatermarkBinlogPos:
        Ref: WatermarkBinlogPos
      WatermarkGtids:
        Ref: WatermarkGtids
      WatermarkTsSec:
        Ref: WatermarkTsSec

  # --- Debezium MySQL source connector ----------------------------------------
  # Configuration mirrors CdcPipelineOrchestrator.build_source_config:
  # table.include.list = selected tables, snapshot.mode = Ref: SnapshotMode
  # (schema_only for fresh connectors / CDC-only; recovery only when the offset
  # seeder pre-populated schema-history during the gapless Full-Load path — see
  # below). The start offset (GTID / binlog file:position from the Full Load
  # watermark) is seeded by the control plane into the connect-offsets topic for a
  # gapless handoff (Property 11) — it is not a static connector config key, so it
  # is documented here rather than set inline.
  DebeziumSourceConnector:
    Type: AWS::KafkaConnect::Connector
    Condition: DeployMysqlSource
    DependsOn:
      - MskCluster
      - ConnectorSelfIngress
    # Ordering after CdcStartPrepResource (topics pre-created; offset seeded on a
    # gapless handoff) is enforced by the OffsetSeed Tag's Fn::GetAtt below, so no
    # explicit DependsOn is needed here.
    Properties:
      ConnectorName:
        Fn::Sub: ${AWS::StackName}-debezium-source
      KafkaConnectVersion:
        Ref: KafkaConnectVersion
      ServiceExecutionRoleArn:
        Fn::GetAtt: [ConnectorExecutionRole, Arn]
      Capacity:
        ProvisionedCapacity:
          McuCount:
            Ref: ConnectorMcuCount
          WorkerCount:
            Ref: ConnectorWorkerCount
      KafkaCluster:
        ApacheKafkaCluster:
          BootstrapServers:
            Ref: MskBootstrapServers
          Vpc:
            SecurityGroups:
              - Fn::GetAtt: [ConnectorSecurityGroup, GroupId]
            Subnets:
              Fn::If:
                - CreateOwnedNetwork
                - - Ref: ConnectorSubnetA
                  - Ref: ConnectorSubnetB
                - Ref: ConnectorSubnetIds
      KafkaClusterClientAuthentication:
        AuthenticationType: IAM
      KafkaClusterEncryptionInTransit:
        EncryptionType: TLS
      # Reference CdcStartPrepResource.Seeded so the connector is created AFTER the
      # start-prep resource (topics pre-created; offset seeded on a gapless handoff).
      # The GetAtt is the source connector's ordering edge to the in-VPC prep.
      # SeedMode=Lambda: CdcStartPrepResource exists (it shares this connector's
      # bootstrap gate), so this resolves to today's exact tag -- byte-identical.
      # SeedMode=External: CdcStartPrepResource is not created, so the whole Tags
      # property is dropped (AWS::NoValue); ordering is enforced in-process by the
      # app seeding the topics BEFORE this stack update creates the connector.
      Tags:
        Fn::If:
          - SeedByLambda
          - - Key: OffsetSeed
              Value:
                Fn::GetAtt: [CdcStartPrepResource, Seeded]
          - Ref: AWS::NoValue
      WorkerConfiguration:
        Revision:
          Fn::GetAtt: [WorkerConfiguration, Revision]
        WorkerConfigurationArn:
          Fn::GetAtt: [WorkerConfiguration, WorkerConfigurationArn]
      Plugins:
        - CustomPlugin:
            CustomPluginArn:
              Fn::GetAtt: [DebeziumSourcePlugin, CustomPluginArn]
            Revision:
              Fn::GetAtt: [DebeziumSourcePlugin, Revision]
      LogDelivery:
        WorkerLogDelivery:
          CloudWatchLogs:
            Enabled: true
            LogGroup:
              Ref: ConnectorLogGroup
      ConnectorConfiguration:
        connector.class: io.debezium.connector.mysql.MySqlConnector
        tasks.max:
          Fn::Sub: "${SourceTasksMax}"
        database.hostname:
          Ref: SourceDbHostname
        database.port:
          Fn::Sub: "${SourceDbPort}"
        # Resolved at runtime by the MSK Connect Secrets Manager config provider.
        # Built with Fn::Join so the literal "${secretsManager:...}" reaches the
        # connector config verbatim (Fn::Sub would try to interpret ${...}).
        # SourceSecretName (colon-free) is used here -- NOT SourceSecretArn --
        # because the ${provider:path:key} syntax splits on ':' and an ARN is full
        # of colons (gotcha #7). SourceSecretArn is retained for the IAM policy.
        database.user:
          Fn::Join: ["", ["${secretsManager:", Ref: SourceSecretName, ":username}"]]
        database.password:
          Fn::Join: ["", ["${secretsManager:", Ref: SourceSecretName, ":password}"]]
        database.server.id:
          Fn::Sub: "${SourceDbServerId}"
        topic.prefix:
          Ref: TopicPrefix
        table.include.list:
          Fn::Join: [",", Ref: TableIncludeList]
        # H13 prevention: drop oversized LOB columns at capture so a value that
        # could exceed DSQL's 1 MiB per-value limit never reaches Kafka/the sink.
        # Empty (default) excludes nothing; never list a PK column.
        column.exclude.list:
          Ref: ColumnExcludeList
        # Composite-PK re-key: when a table's DSQL target has a composite key
        # (leading column prepended to the source PK), key the change record on
        # those target columns so the sink's record-key ON CONFLICT/DELETE match.
        # Debezium REJECTS an empty value, so the key is OMITTED (AWS::NoValue)
        # when none is supplied -- then the record is keyed on the source PK.
        message.key.columns:
          Fn::If:
            - HasMessageKeyColumns
            - Ref: MessageKeyColumns
            - Ref: AWS::NoValue
        # MSK Serverless does NOT auto-create topics (gotcha #8). Debezium must
        # create per-table data topics itself. replication.factor=-1 uses the
        # broker default (required for MSK Serverless). partitions must be a
        # positive integer (-1 is REJECTED with "Number of partitions is below 1").
        topic.creation.enable: "true"
        topic.creation.default.replication.factor: "-1"
        topic.creation.default.partitions:
          Fn::Sub: "${TopicDefaultPartitions}"
        # H13: the per-table data topics must also accept a change event up to
        # MaxMessageBytes. MSK Serverless creates topics with max.message.bytes at
        # the broker default (~1 MiB), so even with producer.max.request.size raised
        # the BROKER rejects a 1-4 MiB record ("RecordTooLargeException: ... larger
        # than the max message size the server will accept") -- the source task drops
        # it (silent loss) and it never reaches the sink/DLQ. Setting the topic's
        # max.message.bytes here (capped at the 8 MiB MSK Serverless maximum) is what
        # lets a 1-4 MiB record traverse Kafka so the SINK can dead-letter it on the
        # DSQL 1 MiB per-value limit (the band that makes the DLQ demonstrable).
        topic.creation.default.max.message.bytes:
          Fn::Sub: "${MaxMessageBytes}"
        # Size-proportional partitions: hot tables get more partitions than the
        # default so they are not serialized on one sink task (skewed-workload
        # fix). Each key is omitted (AWS::NoValue) unless its group is active. The
        # groups MUST also set max.message.bytes (H13) and replication.factor=-1,
        # exactly like the default group -- a group inherits nothing from default.
        topic.creation.groups:
          Fn::If:
            - HasTopicCreationGroups
            - Ref: TopicCreationGroups
            - Ref: AWS::NoValue
        topic.creation.p2.include:
          Fn::If: [HasTopicGroup2, Ref: TopicGroupInclude2, Ref: AWS::NoValue]
        topic.creation.p2.partitions:
          Fn::If: [HasTopicGroup2, "2", Ref: AWS::NoValue]
        topic.creation.p2.replication.factor:
          Fn::If: [HasTopicGroup2, "-1", Ref: AWS::NoValue]
        topic.creation.p2.max.message.bytes:
          Fn::If:
            - HasTopicGroup2
            - Fn::Sub: "${MaxMessageBytes}"
            - Ref: AWS::NoValue
        topic.creation.p4.include:
          Fn::If: [HasTopicGroup4, Ref: TopicGroupInclude4, Ref: AWS::NoValue]
        topic.creation.p4.partitions:
          Fn::If: [HasTopicGroup4, "4", Ref: AWS::NoValue]
        topic.creation.p4.replication.factor:
          Fn::If: [HasTopicGroup4, "-1", Ref: AWS::NoValue]
        topic.creation.p4.max.message.bytes:
          Fn::If:
            - HasTopicGroup4
            - Fn::Sub: "${MaxMessageBytes}"
            - Ref: AWS::NoValue
        # Full Load already loaded the row data; we only need to resume streaming
        # from the watermark-seeded connect-offset WITHOUT re-reading any rows.
        # MUST be `recovery` (NOT schema_only/no_data): the offset seeder seeds the
        # connect-offsets topic, so Debezium sees a recorded position and takes the
        # RESUME path -- which requires the schema-history topic to already exist.
        # It does not (only the offset was seeded), so schema_only/no_data die with
        # "The db history topic is missing". `recovery` is built for exactly this:
        # with an existing offset it rebuilds the schema-history topic from the
        # snapshot.mode is parameterized (SnapshotMode):
        # - schema_only: fresh connector, CDC-only, or session reset — reads the
        #   current source schema from scratch and streams from the given offset.
        # - recovery: gapless Full-Load path where the offset seeder Lambda has
        #   pre-populated schema-history — rebuilds history from the CURRENT source
        #   tables without re-reading rows.
        # store.only.captured.tables.ddl=false (default) lets recovery/schema_only
        # cover all tables' DDL.
        snapshot.mode:
          Ref: SnapshotMode
        # When the source has gtid_mode=OFF or OFF_PERMISSIVE, new transactions
        # do NOT receive GTIDs. Without this flag, Debezium records the GTID set
        # at snapshot time and then skips all non-GTID events in streaming
        # (treating them as "already processed"), producing zero records. Setting
        # this to false disables GTID-based DML filtering so file:pos tracking
        # drives event delivery regardless of the source's GTID mode.
        # GTID handling: when the source has gtid_mode=OFF or OFF_PERMISSIVE,
        # new transactions do not receive GTIDs. Without these settings Debezium
        # records the (stale) GTID set at snapshot time, then the binlog client
        # applies a GTID filter that skips all non-GTID events → zero produce.
        # gtid.source.filter.dml.events=false disables the DML skip logic, and
        # gtid.source.excludes with a catch-all UUID pattern prevents Debezium
        # from including any GTID set in the offset, forcing pure file:pos mode.
        gtid.source.filter.dml.events: "false"
        gtid.source.excludes: ".*"
        schema.history.internal.store.only.captured.tables.ddl: "false"
        include.schema.changes: "false"
        # Serialize BIGINT UNSIGNED as an exact BigDecimal (Avro decimal) instead
        # of the default signed Long, which overflows for values > 2^63-1. The
        # DSQL write contract maps BIGINT UNSIGNED to numeric(20,0); a BigDecimal
        # binds correctly there, matching the Full Load bulk loader. (decimal.
        # handling.mode stays at its default 'precise', so DECIMAL is a BigDecimal
        # too -- the custom sink relies on these precise encodings.)
        bigint.unsigned.handling.mode: precise
        # Source-reboot resilience. When the source RDS/Aurora instance reboots
        # (routine maintenance patch, failover, instance-class change), the binlog
        # stream is cut mid-event: Debezium raises a RETRIABLE error and restarts
        # the task after a 10 s backoff -- but that single restart then hits
        # "Error reading MySQL variables: Communications link failure" because the
        # source is still booting, and with errors.retry.timeout at its DEFAULT (0 =
        # do not retry) Kafka Connect KILLS the task ("will not recover until
        # manually restarted") -- a permanent stall (SourceRecordWriteRate=0)
        # requiring a Stop/Start to recover. That is unacceptable for a long-running
        # CDC pipeline (reboots are routine). Mirroring the sink's setting, retry
        # retriable errors for up to 10 min so the task keeps reattempting across the
        # reboot window and resumes from the committed binlog offset once the source
        # is back -- gapless, no human intervention. (2026-07-08: observed a permanent
        # source stall after a 2->8 vCPU scale-up reboot; this is the fix.)
        errors.retry.timeout: "600000"
        errors.retry.delay.max.ms: "60000"
        errors.log.enable: "true"
        # Offset-staleness guard (gapless resumability). Debezium only advances its
        # committed binlog offset when it emits a record; on a source where the
        # CAPTURED tables are idle while OTHER tables churn the binlog, the committed
        # offset falls behind the live binlog head. If source binlog retention then
        # purges past that stale offset, a restart cannot resume -> gap (forced
        # re-Full-Load). A heartbeat emits a periodic record carrying the current
        # position to the heartbeat topic (__debezium-heartbeat.<topic.prefix>, auto-
        # created + covered by the topic/${AWS::StackName}-msk/* IAM grant), so the
        # offset keeps advancing during idle-captured windows. heartbeat.action.query
        # is deliberately NOT set: that would execute a WRITE against the source, and
        # the source is read-only (Property) -- unlike Postgres logical replication,
        # MySQL's binlog position advances from any server activity, so emitting the
        # heartbeat record is enough. The heartbeat topic is internal (never added to
        # SinkTopics), so the sink never sees it.
        heartbeat.interval.ms: "300000"
        # Throughput tuning (H: the source caps ~2,000 rec/s at ~12% CPU, i.e. it
        # is produce/queue-bound, not binlog-parse-bound). max.batch.size /
        # max.queue.size are Debezium connector properties (drain more events per
        # streaming iteration), so they belong here. The producer batch/linger/
        # compression knobs are NOT here: MSK Connect rejects per-connector
        # ".override." keys (connector.client.config.override.policy is excluded),
        # so those live in the SOURCE WorkerConfiguration as producer.* (same rule
        # as the H13 producer.max.request.size and the sink's consumer.max.poll.records).
        max.batch.size:
          Fn::Sub: "${SourceMaxBatchSize}"
        max.queue.size:
          Fn::Sub: "${SourceMaxQueueSize}"
        # Debezium internal schema history topic (self-managed on MSK).
        schema.history.internal.kafka.bootstrap.servers:
          Ref: MskBootstrapServers
        schema.history.internal.kafka.topic:
          Fn::Sub: ${TopicPrefix}.schema-history
        schema.history.internal.producer.security.protocol: SASL_SSL
        schema.history.internal.producer.sasl.mechanism: AWS_MSK_IAM
        # MSK Connect auto-injects IAM auth for the connector's OWN producer, but the
        # Debezium schema-history is a SEPARATE Kafka client: without an explicit JAAS
        # entry + callback handler it boots with no 'KafkaClient' JAAS config and the
        # task dies (IllegalArgumentException: Could not find a 'KafkaClient' entry).
        # The IAMLoginModule/IAMClientCallbackHandler classes are provided by the MSK
        # Connect 3.7.x runtime -- do NOT bundle aws-msk-iam-auth into the plugin (its
        # older shaded AWS SDK conflicts with msk-config-providers and fails the worker
        # with NoSuchFieldError: AUTH_SCHEME_PROVIDER; gotcha #4).
        schema.history.internal.producer.sasl.jaas.config: software.amazon.msk.auth.iam.IAMLoginModule required;
        schema.history.internal.producer.sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler
        schema.history.internal.consumer.security.protocol: SASL_SSL
        schema.history.internal.consumer.sasl.mechanism: AWS_MSK_IAM
        schema.history.internal.consumer.sasl.jaas.config: software.amazon.msk.auth.iam.IAMLoginModule required;
        schema.history.internal.consumer.sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler
        # key.converter/value.converter are declared in WorkerConfiguration. They
        # are intentionally absent here to avoid split authority -- the worker
        # config is the single canonical source (connector config would shadow it).

  # --- Debezium PostgreSQL source connector (pgoutput) ------------------------
  # Created only for a PostgreSQL source (EngineType=postgres). Mirrors the MySQL
  # source connector's shell (capacity/auth/worker/log/plugin) and shares the same
  # ConnectorName so all monitoring/alarms stay engine-agnostic, but its config uses
  # PostgreSQL logical replication: pgoutput + a pre-created publication + a logical
  # replication slot (no server.id/GTID/schema-history). The tool deploys with
  # SeedMode=External (PostgreSQL resumes from the slot's LSN, not a Kafka
  # connect-offset seed), so there is no CdcStartPrepResource ordering edge.
  PostgresSourceConnector:
    Type: AWS::KafkaConnect::Connector
    Condition: DeployPostgresSource
    DependsOn:
      - MskCluster
      - ConnectorSelfIngress
    Properties:
      ConnectorName:
        Fn::Sub: ${AWS::StackName}-debezium-source
      KafkaConnectVersion:
        Ref: KafkaConnectVersion
      ServiceExecutionRoleArn:
        Fn::GetAtt: [ConnectorExecutionRole, Arn]
      Capacity:
        ProvisionedCapacity:
          McuCount:
            Ref: ConnectorMcuCount
          WorkerCount:
            Ref: ConnectorWorkerCount
      KafkaCluster:
        ApacheKafkaCluster:
          BootstrapServers:
            Ref: MskBootstrapServers
          Vpc:
            SecurityGroups:
              - Fn::GetAtt: [ConnectorSecurityGroup, GroupId]
            Subnets:
              Fn::If:
                - CreateOwnedNetwork
                - - Ref: ConnectorSubnetA
                  - Ref: ConnectorSubnetB
                - Ref: ConnectorSubnetIds
      KafkaClusterClientAuthentication:
        AuthenticationType: IAM
      KafkaClusterEncryptionInTransit:
        EncryptionType: TLS
      WorkerConfiguration:
        Revision:
          Fn::GetAtt: [WorkerConfiguration, Revision]
        WorkerConfigurationArn:
          Fn::GetAtt: [WorkerConfiguration, WorkerConfigurationArn]
      Plugins:
        - CustomPlugin:
            CustomPluginArn:
              Fn::GetAtt: [PostgresSourcePlugin, CustomPluginArn]
            Revision:
              Fn::GetAtt: [PostgresSourcePlugin, Revision]
      LogDelivery:
        WorkerLogDelivery:
          CloudWatchLogs:
            Enabled: true
            LogGroup:
              Ref: ConnectorLogGroup
      ConnectorConfiguration:
        connector.class: io.debezium.connector.postgresql.PostgresConnector
        tasks.max:
          Fn::Sub: "${SourceTasksMax}"
        database.hostname:
          Ref: SourceDbHostname
        database.port:
          Fn::Sub: "${SourceDbPort}"
        # Same Secrets Manager config-provider wiring as the MySQL source (the
        # provider class is bundled in the PostgreSQL plugin zip too).
        database.user:
          Fn::Join: ["", ["${secretsManager:", Ref: SourceSecretName, ":username}"]]
        database.password:
          Fn::Join: ["", ["${secretsManager:", Ref: SourceSecretName, ":password}"]]
        # PostgreSQL captures a single database (unlike MySQL's server-wide capture).
        database.dbname:
          Ref: PgDatabaseName
        # pgoutput is built into RDS/Aurora PostgreSQL -- no server-side output
        # plugin to install; only a publication + a replication slot are needed.
        plugin.name: pgoutput
        slot.name:
          Ref: PgSlotName
        publication.name:
          Ref: PgPublicationName
        # The tool/DBA pre-creates the publication (scoped to the migrated tables);
        # Debezium must not auto-create it (never FOR ALL TABLES).
        publication.autocreate.mode:
          Ref: PgPublicationAutocreateMode
        # Keep the slot on stop so a Stop/Start resumes gaplessly from its LSN.
        slot.drop.on.stop: "false"
        topic.prefix:
          Ref: TopicPrefix
        table.include.list:
          Fn::Join: [",", Ref: TableIncludeList]
        column.exclude.list:
          Ref: ColumnExcludeList
        message.key.columns:
          Fn::If:
            - HasMessageKeyColumns
            - Ref: MessageKeyColumns
            - Ref: AWS::NoValue
        # Topic creation (engine-neutral -- identical to the MySQL source): MSK
        # Serverless does not auto-create topics, so Debezium must, sized to accept
        # up to MaxMessageBytes.
        topic.creation.enable: "true"
        topic.creation.default.replication.factor: "-1"
        topic.creation.default.partitions:
          Fn::Sub: "${TopicDefaultPartitions}"
        topic.creation.default.max.message.bytes:
          Fn::Sub: "${MaxMessageBytes}"
        topic.creation.groups:
          Fn::If:
            - HasTopicCreationGroups
            - Ref: TopicCreationGroups
            - Ref: AWS::NoValue
        topic.creation.p2.include:
          Fn::If: [HasTopicGroup2, Ref: TopicGroupInclude2, Ref: AWS::NoValue]
        topic.creation.p2.partitions:
          Fn::If: [HasTopicGroup2, "2", Ref: AWS::NoValue]
        topic.creation.p2.replication.factor:
          Fn::If: [HasTopicGroup2, "-1", Ref: AWS::NoValue]
        topic.creation.p2.max.message.bytes:
          Fn::If:
            - HasTopicGroup2
            - Fn::Sub: "${MaxMessageBytes}"
            - Ref: AWS::NoValue
        topic.creation.p4.include:
          Fn::If: [HasTopicGroup4, Ref: TopicGroupInclude4, Ref: AWS::NoValue]
        topic.creation.p4.partitions:
          Fn::If: [HasTopicGroup4, "4", Ref: AWS::NoValue]
        topic.creation.p4.replication.factor:
          Fn::If: [HasTopicGroup4, "-1", Ref: AWS::NoValue]
        topic.creation.p4.max.message.bytes:
          Fn::If:
            - HasTopicGroup4
            - Fn::Sub: "${MaxMessageBytes}"
            - Ref: AWS::NoValue
        # snapshot.mode=never for the gapless handoff (the slot holds the start LSN,
        # so no snapshot is taken); 'initial' for a stand-alone CDC.
        snapshot.mode:
          Ref: PgSnapshotMode
        # Deterministic encodings the custom DSQL sink relies on (match the Full Load
        # write contract): unconstrained numeric -> BigDecimal, interval -> ISO-8601
        # string, bytea -> raw bytes, time/timestamp -> microseconds.
        decimal.handling.mode: precise
        interval.handling.mode: string
        binary.handling.mode: bytes
        time.precision.mode: adaptive_time_microseconds
        # Same source-reboot resilience as the MySQL source (RETRIABLE errors retried
        # for up to 10 min so a failover/patch reboot resumes without a manual Start).
        errors.retry.timeout: "600000"
        errors.retry.delay.max.ms: "60000"
        errors.log.enable: "true"
        # Offset-staleness guard. A PostgreSQL logical slot's confirmed_flush_lsn only
        # advances when the captured tables change, so on an idle-captured source the
        # slot can pin WAL. heartbeat.interval.ms emits a periodic heartbeat; a real
        # slot-advance on a low-traffic source additionally needs heartbeat.action.query
        # (a WRITE), which is opt-in via PgHeartbeatQuery because the source is
        # otherwise read-only. (Slot lifecycle/monitoring is finalized in a later Phase.)
        heartbeat.interval.ms: "300000"
        heartbeat.action.query:
          Fn::If:
            - HasPgHeartbeatQuery
            - Ref: PgHeartbeatQuery
            - Ref: AWS::NoValue
        max.batch.size:
          Fn::Sub: "${SourceMaxBatchSize}"
        max.queue.size:
          Fn::Sub: "${SourceMaxQueueSize}"
        # key.converter/value.converter come from WorkerConfiguration (single
        # canonical source), exactly as the MySQL source connector.

  # --- Custom DSQL sink connector ---------------------------------------------
  # Configuration mirrors CdcPipelineOrchestrator.build_sink_config: one topic
  # per selected table, PK keying (record_key), idempotent upsert + delete, and
  # a DLQ for poison messages (Req 12.3-12.6). Statement-level OCC (40001) retry,
  # IAM token refresh, and the <=3,000-row batch live in the connector plugin
  # itself (Task 23.2), not in this config.
  # Gated on DeploySinkConnector: deploy the source first (DeploySink=false) so it
  # creates the per-table data topic, then deploy the sink (DeploySink=true) so it
  # subscribes to an existing topic. Starting the sink before the topic exists
  # causes an empty consumer assignment that never recovers (gotcha #11).
  # SeedMode=Lambda variant: keeps DependsOn: CdcStartPrepResource. The sink's
  # ordering edge to the topic pre-creation is a HARD DependsOn, which CloudFormation
  # forbids wrapping in Fn::If -- so the sink is SPLIT into two condition-gated
  # variants. Exactly one is created (the conditions are mutually exclusive). The two
  # Properties bodies are IDENTICAL and MUST stay so; CloudFormation forbids YAML
  # anchors/aliases (Template error: "YAML aliases are not allowed"), so the body is
  # duplicated verbatim into DsqlSinkConnectorExternal below and a unit test asserts
  # the two are byte-identical (tests/test_cdc_stack_seedmode.py). In the default
  # (Lambda) mode DeploySinkConnectorLambda == DeploySinkConnector, so this resource
  # is created identically to before and the External twin is absent.
  DsqlSinkConnector:
    Type: AWS::KafkaConnect::Connector
    Condition: DeploySinkConnectorLambda
    DependsOn:
      - MskCluster
      - ConnectorSelfIngress
      # Depend on the PRE-CREATED TOPICS, not the source connector, so the sink is
      # created IN PARALLEL with the source (both wait only for CdcStartPrepResource
      # to pre-create the topics + partitions -- no empty-partition-assignment race).
      # Previously this DependsOn DebeziumSourceConnector, forcing serial
      # source-then-sink creation (~2x the connector-creation wall time).
      - CdcStartPrepResource
    Properties:
      ConnectorName:
        Fn::Sub: ${AWS::StackName}-dsql-sink
      KafkaConnectVersion:
        Ref: KafkaConnectVersion
      ServiceExecutionRoleArn:
        Fn::GetAtt: [ConnectorExecutionRole, Arn]
      Capacity:
        ProvisionedCapacity:
          McuCount:
            Ref: SinkMcuCount
          WorkerCount:
            Ref: ConnectorWorkerCount
      KafkaCluster:
        ApacheKafkaCluster:
          BootstrapServers:
            Ref: MskBootstrapServers
          Vpc:
            SecurityGroups:
              - Fn::GetAtt: [ConnectorSecurityGroup, GroupId]
            Subnets:
              Fn::If:
                - CreateOwnedNetwork
                - - Ref: ConnectorSubnetA
                  - Ref: ConnectorSubnetB
                - Ref: ConnectorSubnetIds
      KafkaClusterClientAuthentication:
        AuthenticationType: IAM
      KafkaClusterEncryptionInTransit:
        EncryptionType: TLS
      WorkerConfiguration:
        Revision:
          Fn::GetAtt: [SinkWorkerConfiguration, Revision]
        WorkerConfigurationArn:
          Fn::GetAtt: [SinkWorkerConfiguration, WorkerConfigurationArn]
      Plugins:
        - CustomPlugin:
            CustomPluginArn:
              Fn::GetAtt: [DsqlSinkPlugin, CustomPluginArn]
            Revision:
              Fn::GetAtt: [DsqlSinkPlugin, Revision]
      LogDelivery:
        WorkerLogDelivery:
          CloudWatchLogs:
            Enabled: true
            LogGroup:
              Ref: ConnectorLogGroup
      ConnectorConfiguration:
        # Our custom connector (Task 23.2, connectors/dsql-sink). Package path
        # matches DsqlSinkConnector.java in that subproject.
        connector.class: dev.dsqlmigrator.connect.DsqlSinkConnector
        tasks.max:
          Fn::Sub: "${SinkTasksMax}"
        # Explicit topic list (avoids the Fn::Sub backslash-escaping trap that
        # turned topics.regex into a literal-backslash pattern matching nothing --
        # gotcha). Per-table topic = <TopicPrefix>.<db>.<table>. The caller must
        # construct SinkTopics as:
        #   ','.join(f'{prefix}.{t}' for t in build_sink_config.topics)
        topics:
          Ref: SinkTopics
        # Idempotent apply: this custom connector always derives the PK from the
        # Debezium record key and applies INSERT ... ON CONFLICT upsert
        # (build_sink_config: pk_mode=record_key, insert_mode=upsert), so pk.mode/
        # insert.mode are implicit and not set here. delete.enabled toggles
        # DELETE/tombstone apply. Keys below match DsqlSinkConnectorConfig.
        delete.enabled: "true"
        # DSQL connection: IAM token auth (no password). The connector generates
        # the token and refreshes it before the 1-hour timeout (Task 23.2).
        dsql.cluster.endpoint:
          Ref: DsqlClusterEndpoint
        dsql.database:
          Ref: DsqlDatabaseName
        dsql.username:
          Ref: DsqlConnectUser
        dsql.region:
          Fn::If: [RegionProvided, Ref: AwsRegion, Ref: "AWS::Region"]
        # DSQL constraint: <=3,000 rows per transaction.
        batch.size:
          Fn::Sub: "${SinkBatchMaxRows}"
        # Per-table net-rows monitor metric (CloudWatch, best-effort): the sink emits
        # NetRowsApplied per table under this Stack dimension so the UI shows CDC
        # net-rows WITHOUT COUNT(*)-scanning the source. The stack name is the Stack
        # dimension value the UI queries by; blank would disable emission.
        metrics.stack:
          Ref: AWS::StackName
        # Dead-letter queue for poison change events (Req 12.4-12.6). The topic
        # is auto-created at runtime; it is not a CloudFormation resource.
        errors.tolerance: all
        errors.deadletterqueue.topic.name:
          Ref: DlqTopicName
        errors.deadletterqueue.context.headers.enable: "true"
        errors.deadletterqueue.topic.replication.factor: "3"
        errors.log.enable: "true"
        # Retry retriable errors (e.g. OCC SQLSTATE 40001 conflicts) for up to
        # 10 min before dead-lettering, so transient conflicts are absorbed by the
        # connector's statement-level retry instead of being dropped to the DLQ
        # with zero retries (the original errors.retry.timeout=0 default caused
        # contiguous-band data loss under concurrent DML -- see 2026-06 analysis).
        errors.retry.timeout: "600000"
        errors.retry.delay.max.ms: "60000"
        # Log the failed record + exception (not just that an error occurred) so
        # DLQ root-cause is visible in CloudWatch without consuming the DLQ topic.
        errors.log.include.messages: "true"
        # key.converter/value.converter are declared in SinkWorkerConfiguration.
        # They are intentionally absent here to avoid split authority. The H13
        # message-size limits (producer.max.request.size / consumer.fetch.max.bytes
        # / consumer.max.partition.fetch.bytes) AND the consumer poll/session
        # timeouts (consumer.max.poll.interval.ms / session.timeout.ms /
        # heartbeat.interval.ms / offset.flush.timeout.ms) live in the SINK worker
        # config: MSK Connect supports those producer.*/consumer.* keys at the worker
        # level and applies them to the connector's task clients (per the MSK Connect
        # "Supported worker configuration properties" doc, whose allowlist names each
        # of them). What is NOT available is the per-connector ".override." FORM,
        # because MSK Connect excludes connector.client.config.override.policy -- so
        # the worker config is the only place these can be set, not a reason to leave
        # them at Kafka's defaults.

  # SeedMode=External variant: the Properties body below is a VERBATIM copy of
  # DsqlSinkConnector's (CloudFormation forbids YAML anchors, so it cannot be shared;
  # a unit test asserts the two bodies are byte-identical). The ONLY difference is
  # this variant OMITS DependsOn: CdcStartPrepResource -- in External mode that
  # resource is not created (the app pre-created the topics in-process before this
  # update). Ordering is guaranteed by the app seeding topics BEFORE submitting this
  # stack update, so the topics exist before this connector starts (no
  # empty-partition-assignment race). Gated on DeploySinkConnectorExternal so it is
  # absent in the default (Lambda) mode.
  DsqlSinkConnectorExternal:
    Type: AWS::KafkaConnect::Connector
    Condition: DeploySinkConnectorExternal
    DependsOn:
      - MskCluster
      - ConnectorSelfIngress
    Properties:
      ConnectorName:
        Fn::Sub: ${AWS::StackName}-dsql-sink
      KafkaConnectVersion:
        Ref: KafkaConnectVersion
      ServiceExecutionRoleArn:
        Fn::GetAtt: [ConnectorExecutionRole, Arn]
      Capacity:
        ProvisionedCapacity:
          McuCount:
            Ref: SinkMcuCount
          WorkerCount:
            Ref: ConnectorWorkerCount
      KafkaCluster:
        ApacheKafkaCluster:
          BootstrapServers:
            Ref: MskBootstrapServers
          Vpc:
            SecurityGroups:
              - Fn::GetAtt: [ConnectorSecurityGroup, GroupId]
            Subnets:
              Fn::If:
                - CreateOwnedNetwork
                - - Ref: ConnectorSubnetA
                  - Ref: ConnectorSubnetB
                - Ref: ConnectorSubnetIds
      KafkaClusterClientAuthentication:
        AuthenticationType: IAM
      KafkaClusterEncryptionInTransit:
        EncryptionType: TLS
      WorkerConfiguration:
        Revision:
          Fn::GetAtt: [SinkWorkerConfiguration, Revision]
        WorkerConfigurationArn:
          Fn::GetAtt: [SinkWorkerConfiguration, WorkerConfigurationArn]
      Plugins:
        - CustomPlugin:
            CustomPluginArn:
              Fn::GetAtt: [DsqlSinkPlugin, CustomPluginArn]
            Revision:
              Fn::GetAtt: [DsqlSinkPlugin, Revision]
      LogDelivery:
        WorkerLogDelivery:
          CloudWatchLogs:
            Enabled: true
            LogGroup:
              Ref: ConnectorLogGroup
      ConnectorConfiguration:
        # Our custom connector (Task 23.2, connectors/dsql-sink). Package path
        # matches DsqlSinkConnector.java in that subproject.
        connector.class: dev.dsqlmigrator.connect.DsqlSinkConnector
        tasks.max:
          Fn::Sub: "${SinkTasksMax}"
        # Explicit topic list (avoids the Fn::Sub backslash-escaping trap that
        # turned topics.regex into a literal-backslash pattern matching nothing --
        # gotcha). Per-table topic = <TopicPrefix>.<db>.<table>. The caller must
        # construct SinkTopics as:
        #   ','.join(f'{prefix}.{t}' for t in build_sink_config.topics)
        topics:
          Ref: SinkTopics
        # Idempotent apply: this custom connector always derives the PK from the
        # Debezium record key and applies INSERT ... ON CONFLICT upsert
        # (build_sink_config: pk_mode=record_key, insert_mode=upsert), so pk.mode/
        # insert.mode are implicit and not set here. delete.enabled toggles
        # DELETE/tombstone apply. Keys below match DsqlSinkConnectorConfig.
        delete.enabled: "true"
        # DSQL connection: IAM token auth (no password). The connector generates
        # the token and refreshes it before the 1-hour timeout (Task 23.2).
        dsql.cluster.endpoint:
          Ref: DsqlClusterEndpoint
        dsql.database:
          Ref: DsqlDatabaseName
        dsql.username:
          Ref: DsqlConnectUser
        dsql.region:
          Fn::If: [RegionProvided, Ref: AwsRegion, Ref: "AWS::Region"]
        # DSQL constraint: <=3,000 rows per transaction.
        batch.size:
          Fn::Sub: "${SinkBatchMaxRows}"
        # Per-table net-rows monitor metric (CloudWatch, best-effort): the sink emits
        # NetRowsApplied per table under this Stack dimension so the UI shows CDC
        # net-rows WITHOUT COUNT(*)-scanning the source. The stack name is the Stack
        # dimension value the UI queries by; blank would disable emission.
        metrics.stack:
          Ref: AWS::StackName
        # Dead-letter queue for poison change events (Req 12.4-12.6). The topic
        # is auto-created at runtime; it is not a CloudFormation resource.
        errors.tolerance: all
        errors.deadletterqueue.topic.name:
          Ref: DlqTopicName
        errors.deadletterqueue.context.headers.enable: "true"
        errors.deadletterqueue.topic.replication.factor: "3"
        errors.log.enable: "true"
        # Retry retriable errors (e.g. OCC SQLSTATE 40001 conflicts) for up to
        # 10 min before dead-lettering, so transient conflicts are absorbed by the
        # connector's statement-level retry instead of being dropped to the DLQ
        # with zero retries (the original errors.retry.timeout=0 default caused
        # contiguous-band data loss under concurrent DML -- see 2026-06 analysis).
        errors.retry.timeout: "600000"
        errors.retry.delay.max.ms: "60000"
        # Log the failed record + exception (not just that an error occurred) so
        # DLQ root-cause is visible in CloudWatch without consuming the DLQ topic.
        errors.log.include.messages: "true"
        # key.converter/value.converter are declared in SinkWorkerConfiguration.
        # They are intentionally absent here to avoid split authority. The H13
        # message-size limits (producer.max.request.size / consumer.fetch.max.bytes
        # / consumer.max.partition.fetch.bytes) AND the consumer poll/session
        # timeouts (consumer.max.poll.interval.ms / session.timeout.ms /
        # heartbeat.interval.ms / offset.flush.timeout.ms) live in the SINK worker
        # config: MSK Connect supports those producer.*/consumer.* keys at the worker
        # level and applies them to the connector's task clients (per the MSK Connect
        # "Supported worker configuration properties" doc, whose allowlist names each
        # of them). What is NOT available is the per-connector ".override." FORM,
        # because MSK Connect excludes connector.client.config.override.policy -- so
        # the worker config is the only place these can be set, not a reason to leave
        # them at Kafka's defaults.

  # ------------------------------------------------------------------------- #
  # Observability: alarm when a connector task errors out. Without this, recovery
  # waited entirely on a human noticing a FAILED connector in the console -- and if
  # that gap exceeds source binlog retention the resume position is lost. Each alarm
  # watches AWS/KafkaConnect ErroredTaskCount for its connector (dimension
  # ConnectorName; namespace + dimension confirmed against the MSK Connect monitoring
  # docs), so a stalled connector is surfaced automatically. They exist regardless of
  # AlarmNotificationTopicArn (visible in CloudWatch) and notify that SNS topic when
  # one is supplied.
  #
  # NOTE: because the sink re-raises a transient DSQL error as a RetriableException
  # (the connector pauses + redelivers and stays RUNNING rather than dying),
  # ErroredTaskCount fires only for genuinely-fatal states (a poison record with no
  # DLQ, or a fatal source error). A sink that is retrying indefinitely (DSQL down
  # for a long time) is NOT caught by ErroredTaskCount; that is a known limitation,
  # not covered here to avoid false positives on legitimately-idle sources.
  DebeziumSourceErroredTaskAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasBootstrapServers
    Properties:
      AlarmName:
        Fn::Sub: ${AWS::StackName}-debezium-source-errored-task
      AlarmDescription: >
        Debezium MySQL source connector has one or more errored tasks (CDC
        capture stalled). Investigate + restart the connector; a prolonged stall
        past source binlog retention breaks gapless resume (forced re-Full-Load).
      Namespace: AWS/KafkaConnect
      MetricName: ErroredTaskCount
      Dimensions:
        - Name: ConnectorName
          Value:
            Fn::Sub: ${AWS::StackName}-debezium-source
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        Fn::If:
          - HasAlarmTopic
          - [Ref: AlarmNotificationTopicArn]
          - Ref: AWS::NoValue
      OKActions:
        Fn::If:
          - HasAlarmTopic
          - [Ref: AlarmNotificationTopicArn]
          - Ref: AWS::NoValue

  DsqlSinkErroredTaskAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeploySinkConnector
    Properties:
      AlarmName:
        Fn::Sub: ${AWS::StackName}-dsql-sink-errored-task
      AlarmDescription: >
        Custom DSQL sink connector has one or more errored tasks (apply to DSQL
        stalled). Investigate + restart; unapplied change events accumulate in
        the data topic until the sink recovers.
      Namespace: AWS/KafkaConnect
      MetricName: ErroredTaskCount
      Dimensions:
        - Name: ConnectorName
          Value:
            Fn::Sub: ${AWS::StackName}-dsql-sink
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        Fn::If:
          - HasAlarmTopic
          - [Ref: AlarmNotificationTopicArn]
          - Ref: AWS::NoValue
      OKActions:
        Fn::If:
          - HasAlarmTopic
          - [Ref: AlarmNotificationTopicArn]
          - Ref: AWS::NoValue

Outputs:
  MskClusterArn:
    Description: ARN of the MSK Serverless cluster (read its bootstrap string with GetBootstrapBrokers).
    Value:
      Fn::GetAtt: [MskCluster, Arn]

  ConnectorExecutionRoleArn:
    Description: Least-privilege execution role assumed by both MSK Connect connectors.
    Value:
      Fn::GetAtt: [ConnectorExecutionRole, Arn]

  DebeziumSourceConnectorArn:
    Condition: HasBootstrapServers
    Description: ARN of the Debezium MySQL source connector (only present once the bootstrap string is supplied).
    Value:
      Ref: DebeziumSourceConnector

  DsqlSinkConnectorArn:
    Condition: DeploySinkConnector
    Description: ARN of the custom DSQL sink connector (only present when DeploySink=true).
    # Ref whichever sink variant exists for the active SeedMode. In the default
    # (Lambda) mode this resolves to Ref DsqlSinkConnector -- byte-identical.
    Value:
      Fn::If:
        - SeedByLambda
        - Ref: DsqlSinkConnector
        - Ref: DsqlSinkConnectorExternal

  ConnectorLogGroupName:
    Description: CloudWatch log group for connector worker logs (Req 12.9 monitoring).
    Value:
      Ref: ConnectorLogGroup
